<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Mapa de Alejandra — Sr. Instructional Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --purple-deep:#3B2166;
    --purple:#6C4AB6;
    --purple-light:#9B7FD4;
    --pink:#FF4FA3;
    --coral:#FF7A59;
    --gold:#FFB627;
    --teal:#17C3B2;
    --cream:#FFF6E9;
    --ink:#2B1B4D;
    --paper:#FFFFFF;
    --shadow-hard: 0 8px 0 rgba(43,27,77,0.18);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 15% 8%, rgba(255,255,255,0.10), transparent 40%),
      linear-gradient(180deg, #2A1B4D 0%, #4A2E80 14%, #7A46A8 30%, #B855A0 46%, #FF7A6B 64%, #FF9E5E 80%, #FFC96B 100%);
    background-attachment: fixed;
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:'Fredoka', sans-serif;}
  img{max-width:100%; display:block;}
  button{font-family:inherit; cursor:pointer;}
  a{ text-decoration:none; }

  /* ---------- decorative floating shapes ---------- */
  .bg-stars{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;}
  .bg-stars span{position:absolute; opacity:.35; font-size:22px; animation:float 9s ease-in-out infinite;}
  @keyframes float{ 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-26px) rotate(12deg);} }

  /* ---------- persistent controls (lang + sound) ---------- */
  #controls-bar{
    position:fixed; top:14px; right:14px; z-index:90;
    display:flex; align-items:center; gap:8px;
    background:rgba(43,27,77,0.55); backdrop-filter:blur(6px);
    border:2px solid rgba(255,255,255,0.35); border-radius:50px;
    padding:6px; box-shadow:0 4px 0 rgba(0,0,0,0.15);
  }
  .lang-pill{
    font-family:'Fredoka'; font-size:12px; font-weight:600; color:#fff; opacity:.6;
    background:none; border:none; padding:6px 10px; border-radius:20px; letter-spacing:.03em;
  }
  .lang-pill.active{ opacity:1; background:linear-gradient(180deg,var(--gold),#E39400); color:#3B2166;}
  #sound-toggle{ background:none; border:none; font-size:16px; padding:6px 8px; color:#fff; }

  /* ---------- top progress bar ---------- */
  #topbar{
    position:fixed; top:0; left:0; right:0; z-index:50;
    display:flex; align-items:center; gap:12px;
    padding:10px 16px 10px 16px;
    background:rgba(43,27,77,0.55);
    backdrop-filter: blur(6px);
    border-bottom: 3px solid rgba(255,255,255,0.25);
    transform:translateY(-100%);
    transition: transform .4s ease;
  }
  #topbar.show{transform:translateY(0);}
  #topbar .label{color:#fff; font-family:'Fredoka'; font-size:12.5px; white-space:nowrap;}
  #topbar .level{color:var(--gold); font-family:'Fredoka'; font-size:12px; white-space:nowrap; font-weight:600;}
  #topbar .track{flex:1; height:12px; border-radius:20px; background:rgba(255,255,255,0.25); overflow:hidden; border:2px solid rgba(255,255,255,0.4);}
  #topbar .fill{height:100%; width:0%; background:linear-gradient(90deg, var(--gold), var(--pink)); transition:width .5s ease; border-radius:20px;}
  #topbar .count{color:#fff; font-weight:800; font-size:12.5px; white-space:nowrap;}

  /* ---------- achievement toast ---------- */
  #toast-wrap{ position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:95; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none;}
  .toast{
    background:linear-gradient(180deg,#fff,#FFF3D6); border:3px solid var(--gold); border-radius:16px;
    padding:10px 18px; font-family:'Fredoka'; font-weight:600; font-size:13.5px; color:var(--purple-deep);
    box-shadow: 0 6px 0 rgba(0,0,0,.15);
    animation: toastIn .35s ease, toastOut .35s ease 2.4s forwards;
    white-space:nowrap;
  }
  @keyframes toastIn{ from{ transform:translateY(-16px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  @keyframes toastOut{ to{ transform:translateY(-16px); opacity:0;} }

  /* ---------- hero ---------- */
  #hero{
    position:relative; z-index:1;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:90px 20px 60px;
  }
  .eyebrow{
    display:inline-block; background:var(--gold); color:var(--purple-deep);
    font-family:'Fredoka'; font-weight:600; font-size:13px; letter-spacing:.06em;
    padding:6px 16px; border-radius:20px; border:3px solid #fff;
    box-shadow: var(--shadow-hard);
    margin-bottom:22px;
    text-transform:uppercase;
  }
  #hero h1{
    color:#fff; font-size:clamp(34px, 6vw, 64px); font-weight:700; line-height:1.05;
    text-shadow: 0 4px 0 rgba(43,27,77,0.35);
    max-width:820px;
  }
  #hero h1 span{color:var(--gold);}
  #hero p.sub{
    color:#fff; opacity:.92; font-size:clamp(15px,2.2vw,19px); max-width:560px; margin:18px auto 0;
    font-weight:600;
  }
  #hero .avatar-wrap{
    position:relative; margin:34px 0 30px;
    width:min(280px, 55vw);
  }
  #hero .avatar-wrap img{
    filter: drop-shadow(0 18px 20px rgba(0,0,0,0.35));
    animation: bob 4s ease-in-out infinite;
  }
  @keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-14px);} }
  .badge-pop{
    position:absolute; background:#fff; border-radius:50%; border:4px solid var(--gold);
    width:64px; height:64px; display:flex; align-items:center; justify-content:center;
    font-size:28px; box-shadow: var(--shadow-hard);
    animation: spin-in 3.5s ease-in-out infinite;
  }
  .badge-pop.b1{top:-6px; right:-10px; animation-delay:.2s;}
  .badge-pop.b2{bottom:8px; left:-18px; animation-delay:1s; width:52px; height:52px; font-size:22px;}
  @keyframes spin-in{ 0%,100%{transform:rotate(-8deg) scale(1);} 50%{transform:rotate(8deg) scale(1.08);} }

  .btn{
    font-family:'Fredoka'; font-weight:600; font-size:17px;
    color:#fff; background:linear-gradient(180deg, var(--pink), #E23A8C);
    border:4px solid #fff; border-radius:50px;
    padding:15px 34px;
    box-shadow: 0 7px 0 #A8286B, 0 12px 18px rgba(0,0,0,0.25);
    transition: transform .12s ease, box-shadow .12s ease;
    display:inline-block;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:translateY(4px); box-shadow:0 2px 0 #A8286B;}
  .btn.gold{background:linear-gradient(180deg, var(--gold), #E39400); box-shadow:0 7px 0 #A96C00, 0 12px 18px rgba(0,0,0,0.25);}
  .btn.gold:active{box-shadow:0 2px 0 #A96C00;}
  .btn.teal{background:linear-gradient(180deg, var(--teal), #0E9384); box-shadow:0 7px 0 #086A5F, 0 12px 18px rgba(0,0,0,0.25);}
  .btn.teal:active{box-shadow:0 2px 0 #086A5F;}
  .btn.small{ font-size:13.5px; padding:10px 18px; border-width:3px; box-shadow:0 5px 0 rgba(0,0,0,.18);}
  .btn:disabled{opacity:.45; cursor:not-allowed; filter:grayscale(.3);}

  .scroll-cue{margin-top:46px; color:#fff; opacity:.8; font-size:13px; font-weight:700; letter-spacing:.08em;}
  .scroll-cue .chev{display:block; margin:6px auto 0; animation:chevbounce 1.6s infinite;}
  @keyframes chevbounce{0%,100%{transform:translateY(0);} 50%{transform:translateY(8px);}}

  /* ---------- section headers ---------- */
  .section-head{ text-align:center; padding: 70px 20px 30px; position:relative; z-index:2;}
  .section-head h2{ color:#fff; font-size:clamp(26px,4vw,40px); text-shadow:0 3px 0 rgba(43,27,77,.3);}
  .section-head p{ color:#fff; opacity:.9; font-weight:600; max-width:520px; margin:10px auto 0; font-size:15px;}

  /* ---------- path / map ---------- */
  #path-wrap{ position:relative; max-width:900px; margin:0 auto; padding: 10px 20px 60px; z-index:2;}
  #path-line-svg{ position:absolute; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none;}
  #path-line-svg path{ fill:none; stroke:rgba(255,255,255,0.55); stroke-width:6; stroke-dasharray:2 22; stroke-linecap:round; }

  .node{
    position:relative; z-index:2;
    display:flex; align-items:center; gap:18px;
    width:78%;
    margin: 0 0 54px;
  }
  .node:nth-child(odd){ margin-left:0; flex-direction:row; }
  .node:nth-child(even){ margin-left:22%; flex-direction:row-reverse; text-align:right; }

  .node-dot{
    flex:none; width:74px; height:74px; border-radius:50%;
    background:linear-gradient(180deg,#fff,#F1E9FF);
    border:5px solid var(--purple-deep);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fredoka'; font-weight:700; font-size:24px; color:var(--purple-deep);
    box-shadow: var(--shadow-hard);
    transition: transform .2s ease, background .2s ease, border-color .2s;
  }
  .node.locked .node-dot{ background:#8577a8; border-color:#5c4d84; color:#e3dcf7; box-shadow:0 6px 0 rgba(0,0,0,.15);}
  .node.done .node-dot{ background:linear-gradient(180deg, var(--gold), #E39400); border-color:#fff; color:#fff;}
  .node.current .node-dot{ animation:pulse 1.6s infinite; }
  @keyframes pulse{ 0%,100%{ box-shadow: var(--shadow-hard), 0 0 0 0 rgba(255,182,39,0.55);} 50%{ box-shadow: var(--shadow-hard), 0 0 0 14px rgba(255,182,39,0);} }

  .node-card{
    flex:1;
    background:#fff; border:5px solid var(--purple-deep); border-radius:22px;
    padding:16px 20px; box-shadow: var(--shadow-hard);
    cursor:pointer; transition: transform .15s ease;
  }
  .node-card:hover{ transform:translateY(-3px); }
  .node.locked .node-card{ cursor:not-allowed; opacity:.55; }
  .node-card .tag{ font-family:'Fredoka'; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--pink); font-weight:600;}
  .node-card h3{ font-size:17px; color:var(--purple-deep); margin-top:2px;}
  .node-card .years{ font-size:12px; color:#8a7fae; font-weight:700; margin-top:2px;}
  .node.locked .node-card .lock{display:inline;}
  .node-card .lock{display:none; font-size:13px; color:#8a7fae; margin-top:6px; font-weight:700;}

  #player-token{
    position:absolute; left:50%; z-index:3; width:56px; height:56px;
    transform:translate(-50%,-50%);
    transition: top .6s cubic-bezier(.4,1.4,.5,1);
    filter: drop-shadow(0 6px 8px rgba(0,0,0,.35));
    pointer-events:none;
  }
  #player-token img{ border-radius:50%; border:4px solid var(--gold); background:#fff; }

  /* ---------- skills drawer ---------- */
  #skills-fab{
    position:fixed; right:18px; bottom:18px; z-index:60;
    width:64px; height:64px; border-radius:50%;
    background:linear-gradient(180deg,var(--teal),#0E9384);
    border:4px solid #fff; box-shadow: var(--shadow-hard);
    color:#fff; font-family:'Fredoka'; font-weight:700; font-size:22px;
    display:flex; align-items:center; justify-content:center;
  }
  #skills-fab .n{ position:absolute; top:-6px; right:-6px; background:var(--pink); color:#fff; border:3px solid #fff; border-radius:50%; width:26px; height:26px; font-size:12px; display:flex; align-items:center; justify-content:center; font-family:'Nunito'; font-weight:800;}
  #skills-drawer{
    position:fixed; right:0; top:0; bottom:0; width:min(340px, 88vw); z-index:70;
    background:var(--cream); border-left:5px solid var(--purple-deep);
    transform:translateX(105%); transition: transform .35s ease;
    padding:26px 20px; overflow-y:auto;
  }
  #skills-drawer.open{ transform:translateX(0); }
  #skills-drawer h3{ color:var(--purple-deep); font-size:20px; margin-bottom:4px;}
  #skills-drawer .sub{ font-size:13px; color:#6b5d94; font-weight:700; margin-bottom:18px;}
  #skills-drawer .close{ position:absolute; top:16px; right:16px; background:none; border:none; font-size:22px; color:var(--purple-deep); font-weight:700;}
  .skill-item{
    display:flex; gap:12px; align-items:center;
    background:#fff; border:3px solid #e4d9ff; border-radius:16px; padding:10px 12px; margin-bottom:10px;
    opacity:.4; filter:grayscale(1);
    transition: all .3s ease;
  }
  .skill-item.unlocked{ opacity:1; filter:none; border-color:var(--gold); }
  .skill-item .ic{ font-size:24px; flex:none; width:38px; text-align:center;}
  .skill-item .name{ font-size:13.5px; font-weight:800; color:var(--purple-deep); line-height:1.25;}
  #drawer-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:65; display:none;}
  #drawer-overlay.show{ display:block; }

  /* ---------- modal ---------- */
  #modal-overlay{
    position:fixed; inset:0; background:rgba(20,10,40,0.68); z-index:100;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  #modal-overlay.show{ display:flex; }
  #modal{
    background:#fff; border-radius:26px; border:6px solid var(--purple-deep);
    max-width:560px; width:100%; max-height:88vh; overflow-y:auto;
    padding:26px 26px 24px; position:relative;
    box-shadow: 0 14px 0 rgba(0,0,0,.2);
  }
  #modal .modal-close{ position:absolute; top:14px; right:16px; background:none; border:none; font-size:24px; color:var(--purple-deep); font-weight:700;}
  #modal .modal-avatar{ width:110px; margin:0 auto 6px; }
  #modal .tag{ font-family:'Fredoka'; font-size:12px; color:var(--pink); text-transform:uppercase; letter-spacing:.06em; font-weight:700; text-align:center;}
  #modal h3{ color:var(--purple-deep); font-size:22px; text-align:center; margin:4px 0 2px;}
  #modal .years{ text-align:center; font-size:12.5px; color:#8a7fae; font-weight:800; margin-bottom:14px;}
  #modal p.desc{ font-size:15px; line-height:1.55; color:#3d2f66; margin-bottom:18px;}
  #modal .skill-award{
    display:flex; align-items:center; gap:12px;
    background:var(--cream); border:3px dashed var(--gold); border-radius:16px; padding:12px 14px; margin-bottom:20px;
  }
  #modal .skill-award .ic{ font-size:26px; }
  #modal .skill-award .txt{ font-size:12.5px; font-weight:800; color:var(--purple-deep);}
  #modal .skill-award .txt small{ display:block; font-weight:700; color:#8a7fae; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em;}
  #modal .modal-cta{ display:flex; justify-content:center; }

  /* ---------- quiz section ---------- */
  #quiz-section{ position:relative; z-index:2; max-width:640px; margin:0 auto; padding:0 20px 70px;}
  #quiz-card{
    background:#fff; border:6px solid var(--purple-deep); border-radius:26px; padding:30px 26px;
    box-shadow: var(--shadow-hard);
  }
  #quiz-card.locked{ text-align:center; opacity:.85;}
  #quiz-card .qhead{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  #quiz-card .qhead .qn{ font-family:'Fredoka'; color:var(--pink); font-weight:700; font-size:13px;}
  #quiz-card .qhead .qscore{ font-family:'Fredoka'; color:var(--purple-deep); font-weight:700; font-size:13px;}
  #quiz-card h3.question{ color:var(--purple-deep); font-size:19px; margin-bottom:16px; line-height:1.35;}
  .opt{
    display:block; width:100%; text-align:left; background:var(--cream); border:3px solid #e4d9ff; border-radius:14px;
    padding:12px 16px; margin-bottom:10px; font-size:14.5px; font-weight:700; color:#3d2f66;
    transition: all .15s ease;
  }
  .opt:hover{ border-color:var(--purple-light); }
  .opt.correct{ background:#E4FBF3; border-color:var(--teal); color:#0E7A6B;}
  .opt.wrong{ background:#FFEBEA; border-color:#FF7A6B; color:#B23A2E;}
  #quiz-feedback{ margin-top:14px; display:none; }
  #quiz-feedback.show{ display:flex; gap:14px; align-items:flex-start; background:var(--cream); border:3px dashed var(--gold); border-radius:16px; padding:14px 16px;}
  #quiz-feedback img{ width:56px; flex:none; }
  #quiz-feedback p{ font-size:13.5px; color:#3d2f66; font-weight:600; line-height:1.4;}
  #quiz-feedback p b{ color:var(--purple-deep); }
  #quiz-next{ margin-top:16px; text-align:right; }

  /* ---------- victory ---------- */
  #victory{ position:relative; z-index:2; text-align:center; padding: 40px 20px 110px; }
  #victory .card{
    max-width:640px; margin:0 auto; background:#fff; border:6px solid var(--purple-deep); border-radius:28px;
    padding:40px 30px 34px; box-shadow: var(--shadow-hard); position:relative; overflow:hidden;
  }
  #victory img.avatar{ width:180px; margin:0 auto 10px; filter: drop-shadow(0 14px 14px rgba(0,0,0,.25)); }
  #victory h2{ color:var(--purple-deep); font-size:clamp(24px,4vw,34px); }
  #victory p.lead{ color:#3d2f66; font-weight:700; max-width:480px; margin:12px auto 18px; font-size:15px; line-height:1.5;}
  #victory .streak-badge{
    display:inline-block; background:linear-gradient(180deg,#FFE7B0,var(--gold)); border:3px solid #fff;
    color:var(--purple-deep); font-family:'Fredoka'; font-weight:700; font-size:12.5px;
    padding:8px 16px; border-radius:20px; margin-bottom:16px; box-shadow:var(--shadow-hard);
  }
  #victory .skills-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:20px 0 30px; text-align:left;}
  #victory .skills-grid .skill-item{ opacity:1; filter:none; }
  #victory .divider{ display:flex; align-items:center; gap:10px; margin:26px 0 16px; }
  #victory .divider .line{ flex:1; height:3px; background:#E4D9FF; border-radius:3px;}
  #victory .divider .label{ font-family:'Fredoka'; color:var(--purple-deep); font-weight:700; font-size:14px; white-space:nowrap;}
  #victory .cta-row{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .confetti{ position:absolute; top:-20px; font-size:20px; animation:fall linear forwards; }
  @keyframes fall{ to{ transform: translateY(760px) rotate(360deg); opacity:0; } }

  #locked-hint{ display:none; position:fixed; bottom:100px; right:20px; background:var(--purple-deep); color:#fff; padding:10px 16px; border-radius:14px; font-size:13px; font-weight:700; z-index:80; box-shadow:0 6px 0 rgba(0,0,0,.2); max-width:240px;}
  #locked-hint.show{ display:block; animation:shake .4s; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  footer{ position:relative; z-index:2; text-align:center; padding:26px 20px 40px; color:#fff; opacity:.75; font-size:12.5px; font-weight:700;}

  @media (max-width:640px){
    .node{ width:100%; margin-left:0 !important; flex-direction:row !important; text-align:left !important; gap:12px;}
    .node-dot{ width:58px; height:58px; font-size:19px; }
    #path-line-svg{ display:none; }
    #player-token{ display:none; }
    #victory .skills-grid{ grid-template-columns:1fr 1fr; }
    #controls-bar{ top:8px; right:8px; }
  }
</style>
</head>
<body>

<div class="bg-stars" id="bgStars"></div>

<div id="controls-bar">
  <button class="lang-pill" data-lang="es">ES</button>
  <button class="lang-pill" data-lang="en">EN</button>
  <button class="lang-pill" data-lang="pt">PT</button>
  <button id="sound-toggle" title="Sonido">🔊</button>
</div>

<div id="topbar">
  <span class="label" id="topbarLabel">Progreso de la aventura</span>
  <span class="level" id="topbarLevel"></span>
  <div class="track"><div class="fill" id="topbarFill"></div></div>
  <span class="count" id="topbarCount">0 XP</span>
</div>

<div id="toast-wrap"></div>

<!-- ================= HERO ================= -->
<section id="hero">
  <div class="eyebrow" id="heroEyebrow"></div>
  <h1 id="heroTitle"></h1>
  <p class="sub" id="heroSub"></p>

  <div class="avatar-wrap">
    <img id="heroAvatar" src="" alt="Alejandra">
    <div class="badge-pop b1">🧩</div>
    <div class="badge-pop b2">📘</div>
  </div>

  <button class="btn" id="startBtn"></button>
  <div class="scroll-cue"><span id="scrollCue"></span><span class="chev">⌄</span></div>
</section>

<!-- ================= PATH ================= -->
<div class="section-head">
  <h2 id="pathHeadTitle"></h2>
  <p id="pathHeadSub"></p>
</div>

<div id="path-wrap">
  <svg id="path-line-svg" preserveAspectRatio="none"><path id="path-line-d" d=""/></svg>
  <div id="player-token"><img id="tokenAvatar" src="" alt=""></div>
  <div id="nodes"></div>
</div>

<!-- ================= QUIZ ================= -->
<div class="section-head" id="quiz-head">
  <h2 id="quizHeadTitle"></h2>
  <p id="quizHeadSub"></p>
</div>
<section id="quiz-section">
  <div id="quiz-card" class="locked">
    <p id="quizLockedMsg" style="font-weight:800; color:var(--purple-deep);"></p>
  </div>
</section>

<!-- ================= VICTORY ================= -->
<section id="victory" style="display:none;"></section>

<footer id="footerText"></footer>

<!-- ================= SKILLS DRAWER ================= -->
<div id="drawer-overlay"></div>

let audioCtx = null;
function ensureAudio(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function beep(freq, duration, type, vol, delay){
  if(!soundOn || !audioCtx) return;
  const t0 = audioCtx.currentTime + (delay||0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type||'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(vol||0.15, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+(duration||0.12));
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+(duration||0.12)+0.02);
}

function sfxCorrect(){ ensureAudio(); beep(659.25,0.1,'sine',0.15,0); beep(880,0.15,'sine',0.15,0.09); }
function sfxWrong(){ ensureAudio(); beep(220,0.18,'sawtooth',0.09,0); }
function sfxVictory(){ ensureAudio(); [523.25,659.25,783.99,1046.5].forEach((f,i)=>beep(f,0.2,'sine',0.15,i*0.12)); }

/* ================= TOAST ================= */
function showToast(msg){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 2900);
}

/* ================= INIT ================= */
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('heroAvatar').src = ASSETS.welcome;
  document.getElementById('tokenAvatar').src = ASSETS.pointing;
  renderStars();
  applyLanguage();
  renderNodes();
  renderDrawer();
  drawPathLine();
  updatePlayerToken();
  updateTopbar();

  document.getElementById('startBtn').addEventListener('click', () => {
    sfxClick();
    document.getElementById('path-wrap').scrollIntoView({behavior:'smooth'});
  });

  window.addEventListener('scroll', () => {
    const tb = document.getElementById('topbar');
    if(window.scrollY > window.innerHeight * 0.6){ tb.classList.add('show'); }
    else{ tb.classList.remove('show'); }
  });

  window.addEventListener('resize', () => { drawPathLine(); updatePlayerToken(); });
  window.addEventListener('load', () => { drawPathLine(); updatePlayerToken(); });

  document.getElementById('skills-fab').addEventListener('click', () => { sfxClick(); openDrawer(); });
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  document.getElementById('drawer-overlay').addEventListener('click', closeDrawer);
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modal-overlay').addEventListener('click', (e) => { if(e.target.id === 'modal-overlay') closeModal(); });

  document.querySelectorAll('.lang-pill').forEach(btn => {
    btn.addEventListener('click', () => { sfxClick(); setLanguage(btn.dataset.lang); });
  });
  document.getElementById('sound-toggle').addEventListener('click', () => {
    soundOn = !soundOn;
    document.getElementById('sound-toggle').textContent = soundOn ? '🔊' : '🔇';
    if(soundOn){ ensureAudio(); beep(440,0.08,'triangle',0.1); }
  });
});

function renderStars(){
  const el = document.getElementById('bgStars');
  const icons = ['✦','✧','⭐','✨'];
  let html = '';
  for(let i=0;i<18;i++){
    const left = Math.random()*100;
    const top = Math.random()*100;
    const delay = Math.random()*6;
    const size = 14 + Math.random()*16;
    html += `<span style="left:${left}%; top:${top}%; animation-delay:${delay}s; font-size:${size}px;">${icons[i%icons.length]}</span>`;
  }
  el.innerHTML = html;
}

/* ================= LANGUAGE ================= */
function setLanguage(lang){
  if(lang === currentLang) return;
  currentLang = lang;
  applyLanguage();
  renderNodes();
  renderDrawer();
  setTimeout(() => { drawPathLine(); updatePlayerToken(); }, 30);
  if(unlockedUpTo >= NODES().length && !victoryShown && !quizAnswered){
    renderQuizQuestion();
  }
  if(victoryShown){ renderVictory(); }
}

function applyLanguage(){
  const s = t();
  document.querySelectorAll('.lang-pill').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
  document.getElementById('topbarLabel').textContent = s.topbarLabel;
  document.getElementById('heroEyebrow').textContent = s.heroEyebrow;
  document.getElementById('heroTitle').innerHTML = s.heroTitle;
  document.getElementById('heroSub').innerHTML = s.heroSub;
  document.getElementById('startBtn').textContent = s.startBtn;
  document.getElementById('scrollCue').textContent = s.scrollCue;
  document.getElementById('pathHeadTitle').textContent = s.pathHeadTitle;
  document.getElementById('pathHeadSub').textContent = s.pathHeadSub;
  document.getElementById('quizHeadTitle').textContent = s.quizHeadTitle;
  document.getElementById('quizHeadSub').textContent = unlockedUpTo >= NODES().length ? s.quizHeadSubUnlocked : s.quizHeadSubLocked;
  const qlm = document.getElementById('quizLockedMsg');
  if(qlm) qlm.textContent = s.quizLockedMsg;
  document.getElementById('drawerTitle').textContent = s.drawerTitle;
  document.getElementById('footerText').textContent = s.footerFinal;
  document.getElementById('modalSkillLabel').textContent = s.modalSkillLabel;
  document.getElementById('modalDone').textContent = s.modalDoneBtn;
  document.getElementById('locked-hint').textContent = s.lockedHint;
  updateTopbar();
}

/* ================= NODES / PATH ================= */
function renderNodes(){
  const wrap = document.getElementById('nodes');
  const nodes = NODES();
  const s = t();
  wrap.innerHTML = nodes.map((n, i) => {
    const state = i < unlockedUpTo ? 'done' : (i === unlockedUpTo ? 'current' : 'locked');
    const icon = state === 'done' ? '✓' : (state === 'locked' ? '🔒' : (i+1));
    return `
    <div class="node ${state}" data-index="${i}">
      <div class="node-dot">${icon}</div>
      <div class="node-card">
        <div class="tag">${n.tag}</div>
        <h3>${n.title}</h3>
        <div class="years">${n.years}</div>
        <div class="lock">${s.nodeLockedText}</div>
      </div>
    </div>`;
  }).join('');

  wrap.querySelectorAll('.node').forEach(el => {
    el.addEventListener('click', () => {
      const i = parseInt(el.dataset.index, 10);
      if(i <= unlockedUpTo){ sfxClick(); openModal(i); }
      else{ sfxWrong(); showLockedHint(); }
    });
  });
}

function drawPathLine(){
  const svg = document.getElementById('path-line-svg');
  const wrap = document.getElementById('path-wrap');
  const dots = Array.from(document.querySelectorAll('.node-dot'));
  if(dots.length === 0 || window.innerWidth <= 640) return;
  const wrapRect = wrap.getBoundingClientRect();
  svg.setAttribute('width', wrapRect.width);
  svg.setAttribute('height', wrapRect.height);
  svg.setAttribute('viewBox', `0 0 ${wrapRect.width} ${wrapRect.height}`);

  const pts = dots.map(d => {
    const r = d.getBoundingClientRect();
    return { x: r.left - wrapRect.left + r.width/2, y: r.top - wrapRect.top + r.height/2 };
  });

  let d = `M ${pts[0].x} ${pts[0].y}`;
  for(let i=1;i<pts.length;i++){
    const prev = pts[i-1], cur = pts[i];
    const midY = (prev.y + cur.y) / 2;
    d += ` C ${prev.x} ${midY}, ${cur.x} ${midY}, ${cur.x} ${cur.y}`;
  }
  document.getElementById('path-line-d').setAttribute('d', d);
}

function updatePlayerToken(){
  const token = document.getElementById('player-token');
  const dots = document.querySelectorAll('.node-dot');
  if(dots.length === 0 || window.innerWidth <= 640) return;
  const idx = Math.min(unlockedUpTo, dots.length - 1);
  const dot = dots[idx];
  const wrapRect = document.getElementById('path-wrap').getBoundingClientRect();
  const r = dot.getBoundingClientRect();
  const x = r.left - wrapRect.left + r.width/2;
  const y = r.top - wrapRect.top - 44;
  token.style.left = x + 'px';
  token.style.top = y + 'px';
}

function showLockedHint(){
  const hint = document.getElementById('locked-hint');
  hint.textContent = t().lockedHint;
  hint.classList.add('show');
  clearTimeout(window.__hintTimer);
  window.__hintTimer = setTimeout(() => hint.classList.remove('show'), 1800);
}

/* ================= MODAL ================= */
function openModal(i){
  const n = NODES()[i];
  const s = t();
  document.getElementById('modalAvatar').src = ASSETS[n.pose];
  document.getElementById('modalTag').textContent = n.tag;
  document.getElementById('modalTitle').textContent = n.title;
  document.getElementById('modalYears').innerHTML = n.years;
  document.getElementById('modalDesc').textContent = n.desc;
  document.getElementById('modalSkillIcon').textContent = n.skill.icon;
  document.getElementById('modalSkillName').textContent = n.skill.name;
  document.getElementById('modalSkillLabel').textContent = s.modalSkillLabel;
  document.getElementById('modalDone').textContent = s.modalDoneBtn;

  const doneBtn = document.getElementById('modalDone');
  const alreadyDone = i < unlockedUpTo;
  doneBtn.style.display = alreadyDone ? 'none' : 'inline-block';
  doneBtn.onclick = () => { sfxClick(); completeNode(i); closeModal(); };

  document.getElementById('modal-overlay').classList.add('show');
}
function closeModal(){ document.getElementById('modal-overlay').classList.remove('show'); }

function completeNode(i){
  if(i === unlockedUpTo){
    const n = NODES()[i];
    unlockedUpTo = i + 1;
    sfxUnlock();
    showToast(t().toastUnlocked(n.skill.name));
    renderNodes();
    renderDrawer();
    updateTopbar();
    setTimeout(() => { drawPathLine(); updatePlayerToken(); }, 30);
    if(unlockedUpTo >= NODES().length){ unlockQuiz(); }
  }
}

/* ================= SKILLS DRAWER ================= */
function renderDrawer(){
  const list = document.getElementById('drawerList');
  const nodes = NODES();
  const s = t();
  list.innerHTML = nodes.map((n, i) => {
    const unlocked = i < unlockedUpTo;
    return `<div class="skill-item ${unlocked ? 'unlocked' : ''}">
      <div class="ic">${n.skill.icon}</div>
      <div class="name">${n.skill.name}</div>
    </div>`;
  }).join('');
  document.getElementById('drawerSub').textContent = s.drawerSub(unlockedUpTo, nodes.length);
  document.getElementById('skillsFabCount').textContent = unlockedUpTo;
}
function openDrawer(){
  document.getElementById('skills-drawer').classList.add('open');
  document.getElementById('drawer-overlay').classList.add('show');
}
function closeDrawer(){
  document.getElementById('skills-drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('show');
}

/* ================= TOPBAR (XP + level) ================= */
function computeXP(){
  return unlockedUpTo*100 + quizScore*50;
}
function totalXP(){
  return NODES().length*100 + QUIZ().length*50;
}
function updateTopbar(){
  const xp = computeXP();
  const pct = Math.round((xp / totalXP()) * 100);
  document.getElementById('topbarFill').style.width = pct + '%';
  document.getElementById('topbarCount').textContent = `${xp} XP`;
  const levels = LEVELS[currentLang];
  const label = unlockedUpTo >= levels.length ? t().levelReady : levels[unlockedUpTo];
  document.getElementById('topbarLevel').textContent = label;
}

/* ================= QUIZ ================= */
function unlockQuiz(){
  document.getElementById('quizHeadSub').textContent = t().quizHeadSubUnlocked;
  renderQuizQuestion();
}
function renderQuizQuestion(){
  const card = document.getElementById('quiz-card');
  const s = t();
  const item = QUIZ()[quizIndex];
  card.classList.remove('locked');
  quizAnswered = false;
  card.innerHTML = `
    <div class="qhead">
      <span class="qn">${s.questionLabel(quizIndex+1, QUIZ().length)}</span>
      <span class="qscore">${s.scoreLabel(quizScore)}</span>
    </div>
    <h3 class="question">${item.q}</h3>
    <div id="optsWrap">
      ${item.options.map((opt, i) => `<button class="opt" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div id="quiz-feedback"></div>
    <div id="quiz-next"></div>
  `;
  card.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => selectAnswer(parseInt(btn.dataset.i,10)));
  });
}
function selectAnswer(i){
  if(quizAnswered) return;
  quizAnswered = true;
  const s = t();
  const item = QUIZ()[quizIndex];
  const opts = document.querySelectorAll('#optsWrap .opt');
  opts.forEach((o, idx) => {
    o.style.pointerEvents = 'none';
    if(idx === item.correct) o.classList.add('correct');
    else if(idx === i) o.classList.add('wrong');
  });
  const correct = i === item.correct;
  if(correct){ quizScore++; sfxCorrect(); } else { quizPerfect = false; sfxWrong(); }
  updateTopbar();

  const fb = document.getElementById('quiz-feedback');
  fb.classList.add('show');
  fb.innerHTML = `
    <img src="${ASSETS[correct ? 'wink_ok' : 'lookback']}" alt="">
    <p>${correct ? s.feedbackCorrectPrefix : s.feedbackWrongPrefix}${item.explain}</p>
  `;

  const nextWrap = document.getElementById('quiz-next');
  const isLast = quizIndex === QUIZ().length - 1;
  nextWrap.innerHTML = `<button class="btn teal" id="nextQBtn">${isLast ? s.resultBtn : s.nextBtn}</button>`;
  document.getElementById('nextQBtn').addEventListener('click', () => {
    sfxClick();
    if(isLast){ victoryShown = true; renderVictory(); }
    else{ quizIndex++; renderQuizQuestion(); }
  });
}

function launchConfetti(){
  const card = document.getElementById('victoryCard');
  const icons = ['🎉','✨','⭐','🎊','💜'];
  for(let i=0;i<26;i++){
    const el = document.createElement('span');
    el.className = 'confetti';
    el.textContent = icons[i % icons.length];
    el.style.left = Math.random()*100 + '%';
    el.style.animationDuration = (2.2 + Math.random()*1.6) + 's';
    el.style.animationDelay = (Math.random()*0.6) + 's';
    card.appendChild(el);
    setTimeout(() => el.remove(), 4200);
  }
}

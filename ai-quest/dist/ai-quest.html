<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI QUEST – From Zero to AI Architect</title>
<meta name="description" content="E-learning interactivo y gamificado: de cero a AI Architect (prompts, workflows, agentes, APIs y MCP).">
<meta name="theme-color" content="#070a16">
<style>
:root{
  --bg:#070a16;--bg2:#0b1022;--s1:#0f1530;--s2:#161d3d;--s3:#1d2650;
  --bd:rgba(125,145,255,.2);--bd2:rgba(125,145,255,.4);
  --tx:#e9edff;--mu:#a3acd6;--cy:#22d3ee;--bl:#3b82f6;--vi:#8b5cf6;--gr:#34d399;--rd:#f87171;--am:#fbbf24;
  --grad:linear-gradient(135deg,#22d3ee,#3b82f6 50%,#8b5cf6);
  --r:16px;--sh:0 10px 40px rgba(0,0,0,.45);--fs:1;
}
body.hc{--bg:#000;--bg2:#000;--s1:#0a0a0a;--s2:#141414;--s3:#1f1f1f;--bd:#fff;--bd2:#fff;--tx:#fff;--mu:#e6e6e6;--cy:#5ff0ff;--gr:#5dffb4;--rd:#ff8f8f;--am:#ffe066}
*{box-sizing:border-box}
html{font-size:calc(16px*var(--fs))}
body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,rgba(139,92,246,.18),transparent 60%),radial-gradient(900px 600px at -10% 10%,rgba(34,211,238,.12),transparent 60%),var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}
body.hc{background:#000}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(1.8rem,4vw,2.8rem);letter-spacing:-.02em}h2{font-size:1.5rem}h3{font-size:1.15rem}
p{margin:0 0 .9em}a{color:var(--cy)}
code,pre,.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
code{background:rgba(255,255,255,.08);padding:.1em .4em;border-radius:6px;font-size:.88em}
pre{background:#050816;border:1px solid var(--bd);border-radius:12px;padding:14px;overflow:auto;font-size:.82rem;line-height:1.5;margin:0 0 1em;white-space:pre-wrap;word-break:break-word}
.muted{color:var(--mu)}.small{font-size:.85rem}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px;border-radius:8px}
.skip{position:absolute;left:-999px;top:8px;background:var(--cy);color:#001;padding:8px 14px;border-radius:8px;z-index:200}.skip:focus{left:8px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:150}
body.nomotion *{animation:none!important;transition:none!important}

/* header */
#top{position:sticky;top:0;z-index:50;background:rgba(7,10,22,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
body.hc #top{background:#000}
.bar{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
.logo{font-weight:800;letter-spacing:.04em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:1.15rem;text-decoration:none;white-space:nowrap}
body.hc .logo{color:#5ff0ff;background:none}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav a{color:var(--mu);text-decoration:none;padding:7px 12px;border-radius:10px;font-size:.92rem;font-weight:600}
nav a:hover{background:var(--s2);color:var(--tx)}nav a[aria-current=page]{background:var(--s3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--bd2)}
.hstats{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--s2);border:1px solid var(--bd);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:700;white-space:nowrap}
.menu-btn{display:none}
@media(max-width:860px){.menu-btn{display:inline-flex}nav{display:none;order:5;width:100%;flex-basis:100%}nav.open{display:flex}.bar{flex-wrap:wrap}.hstats .pill.hide-s{display:none}}

main{max-width:1240px;margin:0 auto;padding:22px 18px 160px;outline:none}main:focus,main:focus-visible{outline:none}
.card{background:linear-gradient(180deg,var(--s1),rgba(15,21,48,.7));border:1px solid var(--bd);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
body.hc .card{background:#0a0a0a}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.chip{display:inline-block;background:rgba(34,211,238,.12);color:var(--cy);border:1px solid rgba(34,211,238,.35);border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700}
.chip.violet{background:rgba(139,92,246,.15);color:#c4b5fd;border-color:rgba(139,92,246,.45)}
.chip.green{background:rgba(52,211,153,.13);color:var(--gr);border-color:rgba(52,211,153,.4)}
.chip.amber{background:rgba(251,191,36,.13);color:var(--am);border-color:rgba(251,191,36,.4)}
.chip.red{background:rgba(248,113,113,.13);color:var(--rd);border-color:rgba(248,113,113,.4)}
.btn{font:inherit;font-weight:700;border:1px solid var(--bd2);background:var(--s2);color:var(--tx);padding:10px 18px;border-radius:12px;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s}
.btn:hover:not(:disabled){transform:translateY(-1px);background:var(--s3)}
.btn.pri{background:var(--grad);border-color:transparent;color:#04101f;box-shadow:0 6px 24px rgba(59,130,246,.35)}
body.hc .btn.pri,body.hc .btn.pri:hover:not(:disabled){background:#5ff0ff}
.btn.pri:hover:not(:disabled){background:var(--grad);box-shadow:0 8px 30px rgba(34,211,238,.5)}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.sm{padding:6px 12px;font-size:.85rem;border-radius:9px}.btn.ghost{background:transparent}
.btn.icon{padding:7px 10px;min-width:38px}
.bartrack{height:10px;background:var(--s2);border-radius:99px;overflow:hidden;border:1px solid var(--bd)}
.bartrack>i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:center;padding:28px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 300px at 85% 40%,rgba(139,92,246,.28),transparent 70%);pointer-events:none}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.grad-t{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}body.hc .grad-t{color:#5ff0ff;background:none}
.stat{text-align:center}.stat b{display:block;font-size:1.7rem}.stat span{color:var(--mu);font-size:.82rem}
.sec-t{margin:28px 0 12px;display:flex;align-items:center;gap:10px}

/* map */
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;position:relative}
@media(max-width:1000px){.map{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.map{grid-template-columns:1fr}}
.node{position:relative;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:16px;border-radius:var(--r);background:var(--s1);border:1px solid var(--bd);display:flex;flex-direction:column;gap:6px;min-height:190px;transition:transform .2s,box-shadow .2s,border-color .2s}
.node:hover:not(.locked){transform:translateY(-4px) perspective(600px) rotateX(2deg);border-color:var(--cy);box-shadow:0 14px 40px rgba(34,211,238,.18)}
.node .ico{font-size:1.9rem}.node.locked{opacity:.5;cursor:not-allowed;filter:grayscale(.6)}
.node.cur{border-color:var(--cy);box-shadow:0 0 0 1px var(--cy),0 0 40px rgba(34,211,238,.25);animation:pulse 2.4s infinite}
.node.done{border-color:rgba(52,211,153,.55)}.node .n{position:absolute;top:10px;right:14px;font-weight:800;color:var(--mu);font-size:.8rem}
@keyframes pulse{50%{box-shadow:0 0 0 1px var(--cy),0 0 60px rgba(139,92,246,.4)}}

/* level layout */
.lvl{display:grid;grid-template-columns:270px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.lvl{grid-template-columns:1fr}}
.stepper{position:sticky;top:76px;display:flex;flex-direction:column;gap:6px}
@media(max-width:900px){.stepper{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}.stepper .st{min-width:150px}}
.st{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);font:inherit;font-size:.88rem;text-align:left;cursor:pointer}
.st .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:800;background:var(--s3);flex:none}
.st.cur{border-color:var(--cy);background:var(--s3)}.st.done .dot{background:var(--gr);color:#022}.st:disabled{opacity:.45;cursor:not-allowed}
.stepbar{position:sticky;bottom:0;margin-top:18px;display:flex;gap:10px;justify-content:space-between;align-items:center;background:rgba(7,10,22,.92);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;backdrop-filter:blur(8px);z-index:5;padding-right:150px}@media(max-width:600px){.stepbar{padding-right:100px}.bubble{margin-bottom:60px}}
body.hc .stepbar{background:#000}
.where{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0}
.where>div{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font-size:.88rem}.where b{display:block;color:var(--cy);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
.acc{border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;background:var(--s1);overflow:hidden}
.acc>button{width:100%;font:inherit;color:inherit;background:none;border:0;padding:14px 16px;text-align:left;font-weight:700;display:flex;gap:10px;align-items:center;cursor:pointer}
.acc>button .tk{margin-left:auto;color:var(--gr)}.acc .body{padding:0 16px 14px;color:var(--tx)}.acc.open{border-color:var(--bd2)}
.acc .body ul{margin:.3em 0 .8em;padding-left:1.2em}.acc .body li{margin:.25em 0}
.callout{border-left:4px solid var(--cy);background:rgba(34,211,238,.08);padding:12px 14px;border-radius:0 12px 12px 0;margin:12px 0}.callout.warn{border-color:var(--am);background:rgba(251,191,36,.08)}.callout.simbox{border-color:var(--vi);background:rgba(139,92,246,.1)}
table.t{border-collapse:collapse;width:100%;font-size:.88rem;margin:10px 0}table.t th,table.t td{border:1px solid var(--bd);padding:8px 10px;text-align:left;vertical-align:top}table.t th{background:var(--s2)}
.tblwrap{overflow-x:auto}

/* activities */
.act .q-head{display:flex;gap:8px;margin-bottom:8px}.q-text{font-size:1.15rem}
.opts{display:grid;gap:10px;margin:12px 0}
.opt{font:inherit;color:var(--tx);text-align:left;background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--cy);background:var(--s3)}.opt.sel{border-color:var(--cy);background:var(--s3)}
.opt.ok{border-color:var(--gr);background:rgba(52,211,153,.14)}.opt.bad{border-color:var(--rd);background:rgba(248,113,113,.14)}
.fb{padding:12px 14px;border-radius:12px;margin:12px 0;border:1px solid;animation:pop .35s}.fb.ok{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.5)}.fb.bad{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.5)}.fb.info{background:rgba(139,92,246,.1);border-color:rgba(139,92,246,.5)}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.pool-wrap{margin-bottom:14px}.lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin-bottom:6px}
.pool{min-height:56px;display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:2px dashed var(--bd2);border-radius:14px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.cat{border:1px solid var(--bd);border-radius:14px;background:var(--s1);padding:10px;min-height:110px}.cat.over{border-color:var(--cy);background:var(--s2)}
.cat-h{width:100%;font:inherit;color:inherit;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:left;cursor:pointer;margin-bottom:8px;display:flex;flex-direction:column}.cat-h small{color:var(--mu)}
.cat-h:hover{border-color:var(--cy)}.cat-items{display:flex;flex-direction:column;gap:6px}
.ch{font:inherit;font-size:.88rem;color:var(--tx);background:var(--s3);border:1px solid var(--bd2);border-radius:10px;padding:8px 10px;cursor:grab;text-align:left}.ch.sel{outline:2px solid var(--cy)}.ch.ok{border-color:var(--gr);background:rgba(52,211,153,.15)}.ch.bad{border-color:var(--rd);background:rgba(248,113,113,.15)}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-bottom:8px}@media(max-width:640px){.mrow{grid-template-columns:1fr}}
select,input[type=text],input[type=number],textarea{font:inherit;color:var(--tx);background:#080c1d;border:1px solid var(--bd2);border-radius:10px;padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:90px;font-family:inherit}select.ok,.mrow .ok{border-color:var(--gr)}select.bad{border-color:var(--rd)}
.ord{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:8px}.ord li{display:flex;gap:10px;align-items:center;background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;cursor:grab}.ord li.ok{border-color:var(--gr)}.ord li.bad{border-color:var(--rd)}.ord li.drag{opacity:.4}
.flip{display:block;width:100%;perspective:900px;height:200px;cursor:pointer;border:0;background:none;padding:0;font:inherit;color:inherit}
.flip>div{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}.flip.on>div{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;border:1px solid var(--bd2)}
.flip .f{background:linear-gradient(135deg,var(--s3),var(--s2));font-weight:800;font-size:1.15rem}.flip .b{background:linear-gradient(135deg,#143a52,#26175a);transform:rotateY(180deg);font-size:.95rem}
.slr{margin:18px 0;padding:14px;background:var(--s2);border-radius:14px;border:1px solid var(--bd)}.slr input[type=range]{width:100%;accent-color:#22d3ee}.slr .val{font-weight:800;color:var(--cy)}.slr .ends{display:flex;justify-content:space-between;color:var(--mu);font-size:.8rem}
.seg{cursor:pointer;border-radius:6px;padding:1px 3px;border-bottom:2px dotted var(--bd2)}.seg:hover{background:var(--s3)}.seg.sel{background:rgba(251,191,36,.25);border-color:var(--am)}.seg.ok{background:rgba(52,211,153,.25);border-color:var(--gr)}.seg.bad{background:rgba(248,113,113,.25);border-color:var(--rd)}
.docbox{background:#080c1d;border:1px solid var(--bd);border-radius:14px;padding:16px;line-height:1.9}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tab{font:inherit;font-weight:700;font-size:.88rem;padding:8px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--s2);color:var(--tx);cursor:pointer}.tab[aria-selected=true]{background:var(--s3);border-color:var(--cy)}.tab .v{color:var(--gr)}
.fld{margin-bottom:14px}.fld>label,.fld>.fl{display:block;font-weight:700;margin-bottom:4px}.fld small{display:block;color:var(--mu);margin-bottom:5px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:6px 0}.chk input{margin-top:5px;accent-color:#22d3ee}
.preview{background:#060a1a;border:1px dashed var(--vi);border-radius:14px;padding:14px;margin:12px 0}.preview .pl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#c4b5fd;margin-bottom:6px;font-weight:800}
.rl{list-style:none;padding:0;margin:10px 0}.rl li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd)}.rl .i{flex:none;font-weight:800}.rl .ok .i{color:var(--gr)}.rl .no .i{color:var(--rd)}.rl small{display:block;color:var(--mu)}
.meter{display:flex;align-items:center;gap:10px}.meter .bartrack{flex:1}
.cbars{display:grid;gap:8px;margin:12px 0}.cbars div.r{display:grid;grid-template-columns:190px 1fr 50px;gap:10px;align-items:center;font-size:.88rem}@media(max-width:640px){.cbars div.r{grid-template-columns:1fr}}
.pipe{display:flex;flex-direction:column;gap:0;margin:12px 0}.pn{display:flex;gap:10px;align-items:center;background:var(--s2);border:1px solid var(--bd);border-left:5px solid var(--c,var(--cy));border-radius:12px;padding:9px 12px}.pn .no{font-weight:800;color:var(--mu);width:22px}.pn .tx{flex:1;font-size:.9rem}
.arr{text-align:center;color:var(--mu);line-height:1;height:18px}.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.pb{font:inherit;color:var(--tx);text-align:left;background:var(--s1);border:1px solid var(--bd);border-left:5px solid var(--c,var(--cy));border-radius:12px;padding:9px 12px;cursor:pointer;font-size:.88rem}.pb:hover{background:var(--s3)}.pb small{display:block;color:var(--mu)}
.t-trigger{--c:#fbbf24}.t-data{--c:#22d3ee}.t-ai{--c:#8b5cf6}.t-cond{--c:#fb923c}.t-action{--c:#34d399}.t-human{--c:#f472b6}.t-bad{--c:#f87171}
svg.dg{width:100%;height:auto;background:#060a1a;border:1px solid var(--bd);border-radius:14px}
.dg text{fill:var(--tx);font-family:inherit;pointer-events:none}.dg .nd{cursor:pointer}.dg .nd rect{fill:var(--s2);stroke:var(--bd2);stroke-width:1.5;transition:.2s}.dg .nd:hover rect,.dg .nd:focus rect{stroke:var(--cy)}.dg .nd.vis rect{stroke:var(--gr)}.dg .nd.hl rect{fill:#1a2f6b;stroke:var(--cy);stroke-width:3}.dg .grp rect{fill:rgba(139,92,246,.07);stroke:var(--vi);stroke-dasharray:6 5}.dg .ed{stroke:#6d7ab8;stroke-width:2;fill:none}.dg .ed.hl{stroke:var(--cy);stroke-width:3.5}.dg .ed.dash{stroke-dasharray:6 5}
.dg .sub{fill:var(--mu);font-size:11px}.dg .lb{font-size:11px;fill:var(--mu)}
.c-vi rect{stroke:var(--vi)!important}.c-cy rect{stroke:var(--cy)!important}.c-gr rect{stroke:var(--gr)!important}.c-am rect{stroke:var(--am)!important}
.sim{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:900px){.sim{grid-template-columns:1fr}}
.term{background:#04060f;border:1px solid var(--bd);border-radius:12px;padding:12px;height:360px;overflow:auto;font-size:.78rem}
.msg{margin-bottom:10px;border-left:3px solid;padding-left:8px;white-space:pre-wrap;word-break:break-word}.msg.c2s{border-color:var(--bl)}.msg.s2c{border-color:var(--vi)}.msg.err{border-color:var(--rd)}.msg .h{font-weight:800;margin-bottom:2px;font-size:.72rem;color:var(--mu);font-family:Inter,system-ui,sans-serif}
.task{display:flex;gap:8px;padding:4px 0;font-size:.9rem}.task.on{color:var(--gr)}
.status{display:inline-block;font-weight:800;padding:3px 10px;border-radius:8px;background:var(--s3)}.status.s2{background:rgba(52,211,153,.2);color:var(--gr)}.status.s4{background:rgba(251,191,36,.2);color:var(--am)}.status.s5{background:rgba(248,113,113,.2);color:var(--rd)}
.jt{font-size:.85rem;line-height:1.8}.jt .k{color:#7dd3fc;cursor:pointer;border-radius:4px;padding:0 2px}.jt .k:hover{background:var(--s3)}.jt .kid{margin-left:18px}.jt .sel{outline:2px solid var(--am)}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 10px}.badge .em{width:84px;height:84px;border-radius:24px;display:grid;place-items:center;font-size:2.4rem;background:var(--grad);box-shadow:0 8px 30px rgba(139,92,246,.4)}.badge.lk .em{background:var(--s3);filter:grayscale(1);opacity:.5;box-shadow:none}.badge.lk{opacity:.8}

/* guide */
#guide{position:fixed;right:14px;bottom:10px;z-index:60;display:flex;align-items:flex-end;gap:8px;max-width:min(520px,calc(100vw - 20px));pointer-events:none}
#guide>*{pointer-events:auto}
.bubble{background:rgba(15,21,48,.96);border:1px solid var(--bd2);border-radius:16px 16px 4px 16px;padding:12px 14px;box-shadow:var(--sh);font-size:.92rem;max-width:340px;backdrop-filter:blur(10px)}
body.hc .bubble{background:#000}
.bubble .who{font-weight:800;color:var(--cy);font-size:.78rem;margin-bottom:2px}.bubble .ctl{display:flex;gap:4px;margin-top:8px;align-items:center;flex-wrap:wrap}.bubble input[type=range]{width:70px;accent-color:#22d3ee}
.bubble.hidden{display:none}.bubble{margin-bottom:70px}
.gchar{width:132px;height:154px;cursor:pointer;flex:none;border:0;background:none;padding:0;filter:drop-shadow(0 6px 20px rgba(34,211,238,.35))}
@media(max-width:600px){.gchar{width:92px;height:108px}.bubble{max-width:calc(100vw - 120px);font-size:.84rem}}
.stage{perspective:900px;display:grid;place-items:center}.stage .nova{width:min(300px,70vw);height:auto}

<script>
/* Utilidades sin DOM (también se cargan en Node para generar los guiones de voz). */
(function (root) {
  const A = (root.AIQ = root.AIQ || {});
  A.levels = A.levels || {};
  A.act = A.act || {};
  A.util = {
    esc: (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
    shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
    clamp: (n, a, b) => Math.max(a, Math.min(b, n)),
    words: (s) => (String(s || '').trim().match(/\S+/g) || []).length,
    has: (s, re) => re.test(String(s || '')),
    pick: (a) => a[Math.floor(Math.random() * a.length)],
    today: () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); },
    safeJSON(s) { try { return { ok: true, v: JSON.parse(s) }; } catch (e) { return { ok: false, err: e.message }; } },
  };
  if (typeof module !== 'undefined') module.exports = A;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function () {
  const A = window.AIQ;
  const { esc, shuffle } = A.util;

  /* Element.append(null) escribiría el texto «null»: se ignoran null/undefined/false (patrón habitual en condicionales de UI). */
  const _append = Element.prototype.append;
  Element.prototype.append = function (...a) { return _append.apply(this, a.filter((x) => x != null && x !== false)); };

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    kids.flat(9).forEach((c) => { if (c == null || c === false) return; el.append(c.nodeType ? c : document.createTextNode(c)); });
    return el;
  }

  function toast(msg, kind) {
    const t = h('div', { class: 'toast ' + (kind || ''), role: 'status' }, msg);
    document.getElementById('toasts').append(t);
    setTimeout(() => t.remove(), 4200);
  }

  function modal(title, content, opts) {
    opts = opts || {};
    const root = document.getElementById('modal-root');
    const prev = document.activeElement;
    const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); if (prev && prev.focus) prev.focus(); opts.onClose && opts.onClose(); };
    const onKey = (e) => { if (e.key === 'Escape' && !opts.locked) close(); };
    const box = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
      h('h2', null, title), content,
      opts.noClose ? null : h('div', { class: 'row', style: 'margin-top:16px;justify-content:flex-end' }, h('button', { class: 'btn pri', onclick: close }, opts.closeLabel || 'Cerrar')));
    const bg = h('div', { class: 'modal-bg', onclick: (e) => { if (e.target === bg && !opts.locked) close(); } }, box);
    root.append(bg);
    document.addEventListener('keydown', onKey);
    const f = box.querySelector('button,input,select,textarea'); f && f.focus();
    return { close, box };
  }

  function xpFloat(n, anchor) {
    if (!n) return;
    const r = (anchor || document.body).getBoundingClientRect();
    const el = h('div', { class: 'xpfloat', style: `left:${Math.min(window.innerWidth - 90, Math.max(10, r.left + r.width / 2))}px;top:${Math.min(window.innerHeight - 100, Math.max(80, r.top))}px` }, '+' + n + ' XP');
    document.body.append(el);
    setTimeout(() => el.remove(), 1500);
  }

  function confetti() {
    if (!A.store.get().settings.motion) return;
    const c = document.getElementById('fx'), x = c.getContext('2d');
    c.width = innerWidth; c.height = innerHeight;
    const cols = ['#22d3ee', '#3b82f6', '#8b5cf6', '#fbbf24', '#34d399', '#f472b6'];
    const ps = Array.from({ length: 150 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, vx: (Math.random() - .5) * 4, vy: 2 + Math.random() * 5, s: 4 + Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)], r: Math.random() * 6 }));
    let f = 0;
    (function tick() {
      x.clearRect(0, 0, c.width, c.height);
      ps.forEach((p) => { p.x += p.vx; p.y += p.vy; p.r += .1; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); x.restore(); });
      if (++f < 170) requestAnimationFrame(tick); else x.clearRect(0, 0, c.width, c.height);
    })();
  }

  /* Lista de criterios con ✓/✗ reutilizada por simuladores y retos. */
  function results(list) {
    return h('ul', { class: 'rl' }, list.map((r) => h('li', { class: r.ok ? 'ok' : 'no' }, h('span', { class: 'i' }, r.ok ? '✓' : '✗'), h('div', null, r.label, !r.ok && r.hint ? h('small', null, '💡 ' + r.hint) : null))));
  }
  function bar(pct) { return h('div', { class: 'bartrack', role: 'progressbar', 'aria-valuenow': Math.round(pct), 'aria-valuemin': 0, 'aria-valuemax': 100 }, h('i', { style: 'width:' + pct + '%' })); }

  A.ui = { h, esc, shuffle, toast, modal, xpFloat, confetti, results, bar };
})();

</script>
<script>
/* Persistencia del progreso en localStorage (todo ocurre en el navegador). */
(function () {
  const A = window.AIQ;
  const KEY = 'aiquest.v1';
  const def = () => ({
    profile: null, diag: null, xp: 0,
    streak: { count: 0, last: null, best: 0 },
    levels: {}, badges: {}, ach: {},
    settings: { muted: false, volume: 0.8, subs: true, motion: true, contrast: false, font: 1, rate: 1 },
    stats: { labRuns: 0, surprise: 0, surpriseDay: null, surpriseToday: 0, hints: 0 },
    labLog: [],
  });
  let S;
  function load() {
    try { const o = JSON.parse(localStorage.getItem(KEY) || '{}'); S = Object.assign(def(), o); S.settings = Object.assign(def().settings, o.settings); S.stats = Object.assign(def().stats, o.stats); }
    catch (e) { S = def(); }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* modo privado: se sigue sin persistir */ } }
  load();

  const store = {
    get: () => S, save,
    reset() { S = def(); save(); },
    exportJSON: () => JSON.stringify(S, null, 2),
    importJSON(t) { const o = JSON.parse(t); if (typeof o !== 'object' || !('levels' in o)) throw new Error('Archivo inválido'); S = Object.assign(def(), o); save(); },
    level(n) { return S.levels[n] || (S.levels[n] = { seen: {}, acts: {}, mastery: { best: 0, attempts: 0 }, done: false, hints: 0 }); },
    act(n, id) { const L = store.level(n); return L.acts[id] || (L.acts[id] = { done: false, score: 0, xp: 0, attempts: 0 }); },
    unlocked: (n) => n === 1 || !!(S.levels[n - 1] && S.levels[n - 1].done),
    completed: () => Object.values(S.levels).filter((l) => l.done).length,
    progress() {
      let total = 0, done = 0;
      Object.keys(A.levels).forEach((k) => { const lv = A.levels[k]; const L = store.level(k); const acts = lv.practice.concat([lv.challenge]); total += acts.length + 1; done += acts.filter((a) => L.acts[a.id] && L.acts[a.id].done).length + (L.done ? 1 : 0); });
      return total ? Math.round((done / total) * 100) : 0;
    },
    addXP(n) { S.xp += n; save(); const e = document.getElementById('hud-xp'); if (e) e.textContent = S.xp; },
    playerLevel: () => Math.floor(S.xp / 300) + 1,
    markStudy() {
      const t = A.util.today(), s = S.streak;
      if (s.last === t) return;
      const y = new Date(); y.setDate(y.getDate() - 1);
      const ys = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
      s.count = s.last === ys ? s.count + 1 : 1; s.last = t; s.best = Math.max(s.best, s.count); save();
    },
    streakNow() { const s = S.streak, t = A.util.today(); if (!s.last) return 0; const y = new Date(); y.setDate(y.getDate() - 1); const ys = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0'); return (s.last === t || s.last === ys) ? s.count : 0; },
    grant(id, title, icon) { if (S.ach[id]) return false; S.ach[id] = { t: Date.now(), title, icon }; save(); A.ui.toast(`${icon} Logro: ${title}`, 'ok'); A.audio.sfx('badge'); return true; },
  };
  A.store = store;
})();

</script>

<script>
/* Audio: efectos sintetizados con Web Audio (reales, sin archivos) y voz.
   Voz: 1) si config.useAudioFiles y existe assets/audio/<clave>.mp3 se reproduce ese archivo;
        2) si no, se usa la síntesis de voz del navegador (SpeechSynthesis, es-419/es-MX/es-US). */
(function () {
  const A = window.AIQ;
  const cfg = { useAudioFiles: false, audioDir: 'assets/audio/' };
  let ctx = null, cur = null, last = null, paused = false;

  const PAT = {
    click: [[660, 0, .05, 'sine', .12]],
    correct: [[523, 0, .1, 'triangle', .2], [659, .1, .1, 'triangle', .2], [784, .2, .22, 'triangle', .2]],
    wrong: [[220, 0, .16, 'sawtooth', .07], [165, .13, .24, 'sawtooth', .07]],
    unlock: [[392, 0, .1, 'triangle', .2], [523, .1, .1, 'triangle', .2], [659, .2, .1, 'triangle', .2], [784, .3, .1, 'triangle', .2], [1047, .4, .35, 'triangle', .2]],
    badge: [[784, 0, .12, 'sine', .22], [988, .12, .12, 'sine', .22], [1319, .24, .4, 'sine', .22], [1760, .3, .5, 'sine', .08]],
    transition: [[300, 0, .22, 'sine', .1, 900]],
    warn: [[440, 0, .12, 'square', .05], [440, .2, .12, 'square', .05]],
    levelup: [[523, 0, .14, 'triangle', .22], [659, .14, .14, 'triangle', .22], [784, .28, .14, 'triangle', .22], [1047, .42, .5, 'triangle', .25], [1319, .55, .5, 'sine', .15]],
  };
  const st = () => A.store.get().settings;

  function ac() { if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); } if (ctx.state === 'suspended') ctx.resume(); return ctx; }
  function sfx(name) {
    const s = st(); if (s.muted) return;
    const c = ac(); const p = PAT[name]; if (!c || !p) return;
    p.forEach(([f, t, d, type, g, f2]) => {
      const o = c.createOscillator(), gn = c.createGain(), t0 = c.currentTime + t;
      o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
      gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(g * s.volume, t0 + .01); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      o.connect(gn).connect(c.destination); o.start(t0); o.stop(t0 + d + .05);
    });
  }

  function pickVoice() {
    const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
    const es = vs.filter((v) => /^es/i.test(v.lang));
    const score = (v) => (/419|MX|US|CO|AR|CL/i.test(v.lang) ? 4 : 0) + (/female|paulina|sabina|monica|mónica|helena|google|natural|online|sofia|elena/i.test(v.name) ? 2 : 0) + (v.localService ? 0 : 1);
    return es.sort((a, b) => score(b) - score(a))[0] || null;
  }

  function stop() { if (window.speechSynthesis) speechSynthesis.cancel(); if (cur) { cur.pause(); cur = null; } paused = false; A.guide && A.guide.talking(false); }

  function speak(text, key) {
    last = { text, key };
    stop();
    if (st().muted) { A.guide.talking(false); return; }
    const viaTTS = () => {
      if (!window.speechSynthesis) return;
      const u = new SpeechSynthesisUtterance(text); const v = pickVoice();
      u.lang = v ? v.lang : 'es-MX'; if (v) u.voice = v; u.volume = st().volume; u.rate = st().rate || 1; u.pitch = 1.05;
      u.onstart = () => A.guide.talking(true); u.onend = u.onerror = () => A.guide.talking(false);
      speechSynthesis.speak(u);
    };
    if (cfg.useAudioFiles && key) {
      const a = new Audio(cfg.audioDir + key + '.mp3'); a.volume = st().volume; cur = a;
      a.onplay = () => A.guide.talking(true); a.onended = () => { cur = null; A.guide.talking(false); };
      a.onerror = () => { cur = null; viaTTS(); };
      a.play().catch(() => { cur = null; viaTTS(); });
    } else viaTTS();
  }
  function pause() { if (cur) cur.pause(); else if (window.speechSynthesis) speechSynthesis.pause(); paused = true; A.guide.talking(false); }
  function resume() { if (cur) cur.play(); else if (window.speechSynthesis) speechSynthesis.resume(); paused = false; A.guide.talking(true); }

  if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {};
  A.audio = {
    cfg, sfx, speak, stop, pause, resume,
    isPaused: () => paused,
    replay() { if (last) speak(last.text, last.key); },
    setMuted(m) { st().muted = m; if (m) stop(); A.store.save(); },
    setVolume(v) { st().volume = v; if (cur) cur.volume = v; A.store.save(); },

<script>
/* Actividades base: mcq, classify, match, order, flashcards, slider, branch, hotspot.
   Contrato: A.act[tipo](cfg, ctx) -> HTMLElement; llaman ctx.report(score 0-100) tras cada comprobación. */
(function () {
  const A = window.AIQ, { h, shuffle } = A.ui;
  const fb = (ok, html) => h('div', { class: 'fb ' + (ok === null ? 'info' : ok ? 'ok' : 'bad'), role: 'status', html });
  const sfx = (n) => A.audio.sfx(n);

  /* ---------- Selección múltiple / respuesta múltiple (con retroalimentación por pregunta) ---------- */
  A.act.mcq = function (cfg, ctx) {
    const root = h('div', { class: 'act mcq' }), qs = cfg.questions;
    let i = 0, right = 0, order = [];
    const start = () => { i = 0; right = 0; order = cfg.keepOrder ? qs.slice() : shuffle(qs); render(); };
    function render() {
      root.innerHTML = '';
      if (i >= order.length) return summary();
      const q = order[i], ans = q.a !== undefined ? q.a : q.answer, multi = Array.isArray(ans), set = new Set([].concat(ans));
      const opts = shuffle((q.o || q.options).map((t, k) => ({ t, k }))), picked = new Set();
      let locked = false;
      root.append(h('div', { class: 'q-head' }, h('span', { class: 'chip' }, `Pregunta ${i + 1} de ${order.length}`), multi && h('span', { class: 'chip violet' }, 'Marca todas las correctas')));
      root.append(h('h3', { class: 'q-text', html: q.q }));
      const out = h('div'), list = h('div', { class: 'opts', role: multi ? 'group' : 'radiogroup' });
      const btns = opts.map((o) => {
        const b = h('button', { class: 'opt', type: 'button', 'aria-pressed': 'false', onclick: () => {
          if (locked) return; sfx('click');
          if (multi) { picked.has(o.k) ? picked.delete(o.k) : picked.add(o.k); b.classList.toggle('sel', picked.has(o.k)); b.setAttribute('aria-pressed', picked.has(o.k)); go.disabled = !picked.size; }
          else { picked.clear(); picked.add(o.k); submit(); }
        } }, o.t);
        b.dataset.k = o.k; list.append(b); return b;
      });
      const go = h('button', { class: 'btn pri', type: 'button', disabled: true, onclick: () => submit() }, 'Comprobar');
      function submit() {
        locked = true;
        const ok = picked.size === set.size && [...picked].every((k) => set.has(k));
        if (ok) right++;
        btns.forEach((b) => { const k = +b.dataset.k; b.disabled = true; if (set.has(k)) b.classList.add('ok'); else if (picked.has(k)) b.classList.add('bad'); });
        out.append(fb(ok, (ok ? '<b>¡Correcto!</b> ' : '<b>No exactamente.</b> ') + (q.e || q.explain || '')));
        ok ? sfx('correct') : sfx('wrong');
        go.remove();
        out.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { i++; sfx('transition'); render(); } }, i + 1 >= order.length ? 'Ver resultado' : 'Siguiente pregunta →'));
      }
      root.append(list, multi ? go : null, out);
    }
    function summary() {
      const score = Math.round((right / order.length) * 100), pass = ctx.pass;
      root.append(h('h3', null, `Resultado: ${right} de ${order.length} (${score}%)`), A.ui.bar(score),
        cfg.diagnostic ? fb(null, 'Diagnóstico registrado. No tiene nota: es tu punto de partida para medir cuánto avanzas.')
          : fb(score >= pass, score >= pass ? `Superaste el umbral de dominio (${pass}%).` : `Necesitas ${pass}% para continuar. Repasa las explicaciones y reintenta: las preguntas se barajan cada vez.`));
      if (score < pass && !cfg.diagnostic) root.append(h('button', { class: 'btn pri', type: 'button', onclick: start }, 'Reintentar'));
      ctx.report(score);
    }
    start(); return root;
  };

  /* ---------- Clasificación (arrastrar o seleccionar + pulsar categoría) ---------- */
  A.act.classify = function (cfg, ctx) {
    const root = h('div', { class: 'act classify' });
    let items = shuffle(cfg.items.map((it, i) => Object.assign({}, it, { id: i, place: null, st: null }))), sel = null, checked = false;
    function put(id, cat) { const it = items.find((x) => x.id === id); if (it && !checked) { it.place = cat; sel = null; render(); } }
    const chip = (x) => h('button', { class: 'ch' + (sel === x.id ? ' sel' : '') + (x.st ? ' ' + x.st : ''), type: 'button', draggable: !checked, 'aria-label': x.t, onclick: () => { if (checked) return; sfx('click'); sel = sel === x.id ? null : x.id; render(); },
      ondragstart: (e) => e.dataTransfer.setData('text/plain', String(x.id)) }, x.t);
    function render() {
      root.innerHTML = '';
      root.append(h('p', { class: 'muted' }, cfg.instructions || 'Arrastra cada elemento a su categoría, o selecciónalo y pulsa el título de la categoría (funciona también con teclado).'));
      const pool = h('div', { class: 'pool', ondragover: (e) => e.preventDefault(), ondrop: (e) => { e.preventDefault(); put(+e.dataTransfer.getData('text/plain'), null); }, onclick: (e) => { if (sel !== null && e.target === pool) put(sel, null); } });
      items.filter((x) => x.place === null).forEach((x) => pool.append(chip(x)));
      root.append(h('div', { class: 'pool-wrap' }, h('div', { class: 'lbl' }, `Por clasificar (${items.filter((x) => x.place === null).length})`), pool));
      const cats = h('div', { class: 'cats' });
      cfg.categories.forEach((c) => {
        const box = h('div', { class: 'cat', ondragover: (e) => { e.preventDefault(); box.classList.add('over'); }, ondragleave: () => box.classList.remove('over'), ondrop: (e) => { e.preventDefault(); put(+e.dataTransfer.getData('text/plain'), c.id); } },
          h('button', { class: 'cat-h', type: 'button', 'aria-label': 'Colocar en ' + c.label, onclick: () => { if (sel !== null) { sfx('click'); put(sel, c.id); } } }, h('b', null, c.label), c.desc && h('small', null, c.desc)),
          h('div', { class: 'cat-items' }, items.filter((x) => x.place === c.id).map(chip)));
        cats.append(box);
      });
      root.append(cats);
      const left = items.filter((x) => x.place === null).length;
      const out = h('div');
      if (!checked) root.append(h('div', { class: 'row', style: 'margin-top:14px' }, h('button', { class: 'btn pri', type: 'button', disabled: left > 0, onclick: check }, 'Comprobar clasificación'), left ? h('span', { class: 'muted small' }, `Faltan ${left}`) : null));
      root.append(out);
      if (checked) {
        const wrong = items.filter((x) => x.st === 'bad'), ok = items.length - wrong.length, score = Math.round(ok / items.length * 100);
        out.append(fb(!wrong.length, `<b>${ok} de ${items.length} correctos (${score}%).</b>` + (wrong.length ? '<ul>' + wrong.map((x) => `<li><b>${A.util.esc(x.t)}</b> → ${A.util.esc(cfg.categories.find((c) => c.id === x.cat).label)}. ${A.util.esc(x.why || '')}</li>`).join('') + '</ul>' : ' Todo en su lugar.')));
        if (score < 100) out.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { items.forEach((x) => { if (x.st === 'bad') x.place = null; x.st = x.st === 'ok' ? 'ok' : null; }); checked = false; render(); } }, 'Reintentar los incorrectos'));
      }
    }
    function check() { checked = true; items.forEach((x) => (x.st = x.place === x.cat ? 'ok' : 'bad')); const s = Math.round(items.filter((x) => x.st === 'ok').length / items.length * 100); s === 100 ? sfx('correct') : sfx('wrong'); render(); ctx.report(s); }
    render(); return root;
  };

  /* ---------- Emparejar (listas desplegables accesibles) ---------- */
  A.act.match = function (cfg, ctx) {
    const root = h('div', { class: 'act match' });
    const rights = shuffle(cfg.pairs.map((p) => p[1]));
    const sels = cfg.pairs.map((p) => { const s = h('select', { 'aria-label': 'Pareja de: ' + p[0] }, h('option', { value: '' }, '— elige —'), rights.map((r) => h('option', { value: r }, r))); return s; });
    const out = h('div');
    root.append(h('p', { class: 'muted' }, cfg.instructions || 'Une cada elemento de la izquierda con su pareja correcta.'));
    cfg.pairs.forEach((p, i) => root.append(h('div', { class: 'mrow' }, h('div', null, h('b', null, p[0])), sels[i])));
    root.append(h('button', { class: 'btn pri', type: 'button', onclick: () => {
      let ok = 0; out.innerHTML = '';
      const bad = [];
      cfg.pairs.forEach((p, i) => { const good = sels[i].value === p[1]; sels[i].className = good ? 'ok' : 'bad'; if (good) ok++; else bad.push(p); });
      const sc = Math.round(ok / cfg.pairs.length * 100);
      out.append(fb(!bad.length, `<b>${ok} de ${cfg.pairs.length} correctas.</b>` + (bad.length ? ' Revisa: ' + bad.map((p) => `<br>• <b>${A.util.esc(p[0])}</b> ↔ ${A.util.esc(p[1])}`).join('') : '')));
      sc === 100 ? sfx('correct') : sfx('wrong'); ctx.report(sc);
    } }, 'Comprobar emparejamientos'), out);
    return root;
  };

  /* ---------- Ordenar (arrastrar o botones ▲▼) ---------- */
  A.act.order = function (cfg, ctx) {
    const root = h('div', { class: 'act order' });
    let arr = shuffle(cfg.items.map((t, i) => ({ t, i, st: null }))), drag = null;
    if (arr.every((x, k) => x.i === k)) arr.reverse();
    function render(msg) {
      root.innerHTML = '';
      root.append(h('p', { class: 'muted' }, cfg.instructions || 'Ordena los pasos. Arrastra o usa los botones ▲ ▼.'));
      const ul = h('ol', { class: 'ord' });
      arr.forEach((x, k) => {
        const li = h('li', { class: x.st || '', draggable: 'true', ondragstart: () => { drag = k; li.classList.add('drag'); }, ondragend: () => li.classList.remove('drag'), ondragover: (e) => e.preventDefault(), ondrop: () => { if (drag === null) return; const [m] = arr.splice(drag, 1); arr.splice(k, 0, m); drag = null; arr.forEach((a) => (a.st = null)); render(); } },

      fields: [

<script>
(function (root) {
  const A = (root.AIQ = root.AIQ || {});
  const { has, words } = A.util;
  const L8 = [
    ['rol', 'Rol — ¿Quién debe ser la IA?', 'Actúa como diseñador instruccional senior…'], ['ctx', 'Contexto — ¿Qué información necesita?', 'Trabajo en el área de capacitación de una empresa de 300 personas…'],
    ['obj', 'Objetivo — ¿Qué debe conseguir?', 'Lograr que los nuevos colaboradores se sientan…'], ['task', 'Tarea — ¿Qué debe realizar?', 'Diseña una guía de bienvenida de…'],
    ['res', 'Restricciones — ¿Qué debe evitar?', 'No uses jerga; no inventes políticas…'], ['fmt', 'Formato — ¿Cómo entrega el resultado?', 'Tabla con columnas día, actividad, responsable…'],
    ['ex', 'Ejemplos — ¿Qué referencia debe seguir?', 'Ejemplo de fila: «Día 1 | Bienvenida | Líder»'], ['crit', 'Criterios de calidad — ¿Cómo evaluar la respuesta?', 'Debe caber en 1 página y cada actividad tener un responsable…']];
  const build = (v) => {
    const t = v.tech || 'zero'; const sec = (k, t2) => (v[k] && v[k].trim() ? `${t2}:\n${v[k].trim()}\n` : '');
    let p = sec('rol', '# ROL') + sec('ctx', '# CONTEXTO') + sec('obj', '# OBJETIVO') + sec('task', '# TAREA') + sec('res', '# RESTRICCIONES') + sec('fmt', '# FORMATO DE SALIDA') + (v.ex && v.ex.trim() ? `# EJEMPLO${t === 'few' ? 'S (few-shot)' : ' (one-shot)'}:\n"""\n${v.ex.trim()}\n"""\n` : '') + sec('crit', '# CRITERIOS DE CALIDAD');
    return p ? '<pre>' + A.util.esc(p) + '</pre><span class="muted small">Técnica: ' + ({ zero: 'zero-shot (sin ejemplos)', one: 'one-shot (1 ejemplo)', few: 'few-shot (varios ejemplos)' }[t]) + ' · ≈' + Math.ceil(p.length / 4) + ' tokens</span>' : '<i>Completa los campos para ver el prompt ensamblado con delimitadores.</i>';
  };
  A.levels[3] = {
    n: 3, name: 'Prompt Engineering', subtitle: 'Construcción de prompts efectivos y reproducibles', icon: '🛠', bloom: 'Aplicar',
    badge: { id: 'promptengineer', name: 'Prompt Engineer', icon: '🛠' },
    objective: 'Diseñarás un prompt estructurado con los 8 componentes del método y lo aplicarás a un caso laboral, cumpliendo ≥ 80% de los criterios de la rúbrica.',
    narrative: 'Un buen prompt no se improvisa: se diseña. En este nivel pasas de «escribir mensajes» a construir instrucciones reutilizables, como un ingeniero arma una pieza que otros podrán usar.',
    voice: {
      intro: 'Nivel tres: Prompt Engineering. Aprenderás un método de ocho componentes para construir prompts estructurados: rol, contexto, objetivo, tarea, restricciones, formato, ejemplos y criterios de calidad.',
      challenge: 'Reto del nivel tres: construye un prompt profesional para un caso laboral real. Debe incluir los componentes del método y los datos concretos del caso. Se evalúa con diez criterios.',
      done: 'Muy bien. Ya construyes prompts reproducibles que otros pueden usar. Insignia Prompt Engineer desbloqueada.',
    },
    concept: [
      { h: 'El método de 8 componentes', p: '<table class="t"><tr><th>Componente</th><th>Pregunta clave</th></tr><tr><td><b>Rol</b></td><td>¿Quién debe ser la IA?</td></tr><tr><td><b>Contexto</b></td><td>¿Qué información necesita?</td></tr><tr><td><b>Objetivo</b></td><td>¿Qué debe conseguir?</td></tr><tr><td><b>Tarea</b></td><td>¿Qué debe realizar?</td></tr><tr><td><b>Restricciones</b></td><td>¿Qué debe evitar?</td></tr><tr><td><b>Formato</b></td><td>¿Cómo entrega el resultado?</td></tr><tr><td><b>Ejemplos</b></td><td>¿Qué referencia debe seguir?</td></tr><tr><td><b>Criterios</b></td><td>¿Cómo evaluar la respuesta?</td></tr></table><p class="muted small">No siempre necesitas los ocho; úsalos según la complejidad y el riesgo.</p>' },
      { h: 'Zero-shot, one-shot y few-shot', p: '<ul><li><b>Zero-shot:</b> sin ejemplos; para tareas comunes y simples.</li><li><b>One-shot:</b> un ejemplo para fijar formato o estilo.</li><li><b>Few-shot:</b> varios ejemplos para patrones de clasificación o estilos consistentes (incluye casos límite).</li></ul>' },
      { h: 'Role prompting y delimitadores', p: '<p><b>Role prompting:</b> «Actúa como auditor de calidad…» orienta vocabulario, nivel y perspectiva.</p><p><b>Delimitadores</b> (<code>"""</code>, <code>###</code>, etiquetas XML como <code>&lt;texto&gt;…&lt;/texto&gt;</code>) separan instrucciones de datos: evitan confusiones y ayudan contra instrucciones ocultas en el texto.</p>' },
      { h: 'Prompt chaining e iteración', p: '<p><b>Prompt chaining:</b> la salida de un prompt alimenta al siguiente (extraer → clasificar → redactar).</p><p><b>Iterative prompting:</b> evalúas la respuesta y refinas el prompt hasta cumplir los criterios. Guarda las versiones: así es <b>reproducible</b>.</p>' },
    ],
    example: { title: 'El mismo pedido, antes y después del método', html: '<pre>ANTES\n«Hazme una guía de bienvenida.»\n\nDESPUÉS\n# ROL\nActúa como diseñador instruccional senior.\n# CONTEXTO\nEmpresa de 300 personas; ingresan 15 colaboradores/mes; no tenemos intranet.\n# OBJETIVO\nQue el nuevo colaborador complete su primera semana con claridad y sin ayuda constante.\n# TAREA\nDiseña la agenda de la primera semana.\n# RESTRICCIONES\nSin jerga; no inventes políticas; máx. 2 h por día.\n# FORMATO\nTabla: día | actividad | responsable | duración.\n# CRITERIOS\nTodas las actividades con responsable; total ≤ 10 h.</pre><div class="callout">Con el método el prompt se vuelve <b>revisable, reutilizable y mejorable</b>: cualquier compañero puede ajustar una sección.</div>' },
    practice: [
      { id: 'l3-cls', type: 'classify', title: '¿Qué componente es?', xp: 50, goal: 'Clasifica cada fragmento de prompt en el componente del método al que pertenece.', hint: 'Rol = quién es. Restricciones = límites/qué evitar. Formato = cómo se entrega. Criterios = cómo se juzga.',
        categories: [{ id: 'rol', label: 'Rol' }, { id: 'ctx', label: 'Contexto' }, { id: 'res', label: 'Restricciones' }, { id: 'fmt', label: 'Formato' }, { id: 'ex', label: 'Ejemplos' }, { id: 'crit', label: 'Criterios de calidad' }],
        items: [{ t: 'Actúa como auditor de calidad con 10 años de experiencia', cat: 'rol', why: 'Define quién debe ser la IA.' }, { t: 'Somos un equipo de 8 personas que atiende clientes mayoristas', cat: 'ctx', why: 'Información de situación.' }, { t: 'No uses tecnicismos ni menciones precios', cat: 'res', why: 'Dice qué evitar.' }, { t: 'Entrega una tabla con tres columnas', cat: 'fmt', why: 'Describe la forma de la salida.' }, { t: 'Ejemplo: «Entrada: no puedo ingresar → Salida: acceso»', cat: 'ex', why: 'Muestra una referencia concreta.' }, { t: 'Antes de responder verifica que no superes 150 palabras', cat: 'crit', why: 'Criterio de verificación.' }, { t: 'La audiencia son nuevos colaboradores sin experiencia', cat: 'ctx', why: 'Información de contexto (audiencia).' }, { t: 'Responde solo con JSON válido', cat: 'fmt', why: 'Formato de salida.' }, { t: 'Si no tienes el dato, indícalo en lugar de inventarlo', cat: 'res', why: 'Limita el comportamiento: restricción.' }] },
      { id: 'l3-mt', type: 'match', title: 'Técnica ↔ situación', xp: 50, goal: 'Une cada técnica con la situación en la que más ayuda.', hint: 'Piensa en cuántos ejemplos necesitas y si hay varios pasos encadenados.',
        pairs: [['Zero-shot', 'Tarea simple y común, sin necesidad de ejemplos'], ['One-shot', 'Un solo ejemplo basta para fijar el formato'], ['Few-shot', 'Varios ejemplos para una clasificación consistente'], ['Delimitadores', 'Separar claramente instrucciones de un texto a procesar'], ['Prompt chaining', 'La salida de un prompt alimenta al siguiente'], ['Iterative prompting', 'Refinar el prompt tras evaluar la respuesta']] },
      { id: 'l3-bld', type: 'designer', title: 'Constructor de prompts', xp: 80, goal: 'Completa los componentes para una guía de bienvenida de nuevos colaboradores y observa cómo se ensambla el prompt. Meta: ≥ 80%.', hint: 'Completa al menos 7 de los 8 componentes con detalles concretos (no basta con una palabra).',
        scenario: '<b>Caso:</b> RR. HH. necesita una guía de bienvenida para la primera semana de nuevos colaboradores (15 por mes).',
        fields: L8.map(([id, label, ph]) => ({ id, kind: 'text', label, rows: 2, ph })).concat([{ id: 'tech', kind: 'select', label: 'Técnica de ejemplos', options: [{ v: 'zero', t: 'Zero-shot (sin ejemplos)' }, { v: 'one', t: 'One-shot (1 ejemplo)' }, { v: 'few', t: 'Few-shot (varios ejemplos)' }] }]),
        preview: build, previewLabel: 'Prompt ensamblado (con delimitadores)',
        rules: L8.map(([id, label]) => ({ label: label.split(' — ')[0] + ' completado con detalle (≥ 6 palabras)', check: (v) => words(v[id]) >= 6, hint: 'Sé concreto: cifras, nombres, límites.' })).concat([{ label: 'Eliges una técnica coherente con tu ejemplo (one/few si hay ejemplos; zero si no)', check: (v) => (v.tech === 'zero' && !words(v.ex)) || ((v.tech === 'one' || v.tech === 'few') && words(v.ex) > 0), hint: 'Si escribes un ejemplo, selecciona one-shot o few-shot.' }]) },
    ],
    challenge: { id: 'l3-ch', type: 'designer', title: 'Reto: prompt profesional para un caso laboral', xp: 150, goal: 'Escribe UN prompt completo para el caso. Debe contener los componentes del método y los datos concretos del caso. ≥ 80%.', hint: 'Usa encabezados (ROL, CONTEXTO…) o frases claras. Incluye 4 semanas, 3 horas, área comercial, sin conocimientos técnicos.',
      scenario: '<b>Caso:</b> eres analista de capacitación. Debes pedir a la IA un <b>plan de capacitación en seguridad de la información</b> de <b>4 semanas</b>, <b>3 horas por semana</b>, para <b>40 personas del área comercial</b> <b>sin conocimientos técnicos</b>.',
      fields: [{ id: 'p', kind: 'text', rows: 14, label: 'Tu prompt', help: 'Estructúralo con los 8 componentes. Usa delimitadores si incluyes texto de apoyo.' }],
      rules: [
        { label: 'Define un rol', check: (v) => has(v.p, /(act[úu]a como|eres (un|una)|rol\b)/i), hint: '«Actúa como…»' },
        { label: 'Aporta contexto (área comercial, 40 personas)', check: (v) => has(v.p, /(comercial)/i) && has(v.p, /\b40\b/), hint: 'Incluye área y número de personas.' },
        { label: 'Declara un objetivo', check: (v) => has(v.p, /(objetivo|para (que|lograr|reducir|fortalecer)|meta)/i), hint: '¿Qué debe lograr la capacitación?' },
        { label: 'Tarea con las medidas del caso (4 semanas, 3 horas)', check: (v) => has(v.p, /(4|cuatro)\s*semanas/i) && has(v.p, /(3|tres)\s*horas/i), hint: 'Duración y carga horaria.' },
        { label: 'Considera el nivel: sin conocimientos técnicos', check: (v) => has(v.p, /(sin conocimientos t[eé]cnicos|no t[eé]cnic|principiante|sin jerga|lenguaje (simple|claro))/i), hint: 'Indica nivel de la audiencia.' },
        { label: 'Incluye restricciones (qué evitar)', check: (v) => has(v.p, /(no (uses|incluyas|inventes|menciones|superes)|evita|sin )/i), hint: '«No uses jerga», «no inventes normativas».' },
        { label: 'Especifica formato de salida', check: (v) => has(v.p, /(formato|tabla|lista|vi[ñn]etas|json|cronograma|esquema)/i), hint: 'Tabla por semana, p. ej.' },
        { label: 'Incluye un ejemplo o referencia', check: (v) => has(v.p, /(ejemplo|por ejemplo|modelo|referencia)/i), hint: 'Una fila de ejemplo de la tabla.' },
        { label: 'Incluye criterios de calidad / verificación', check: (v) => has(v.p, /(criterios?|verifica|aseg[uú]rate|antes de responder|debe cumplir|calidad)/i), hint: '«Verifica que el total sea 12 horas».' },

      { h: 'Extracción, clasificación y análisis', p: '<ul><li><b>Extracción:</b> sacar campos de texto libre.</li><li><b>Clasificación:</b> asignar categorías de una lista cerrada.</li><li><b>Análisis:</b> comparar, resumir, detectar patrones.</li></ul>' },
      { h: 'Evaluación de resultados', p: '<p>Define casos de prueba y una rúbrica; mide aciertos en ejemplos conocidos; revisa muestras manualmente. Un «modelo juez» puede ayudar, pero también requiere verificación.</p>' },

          { id: 'j', label: 'JSON + validación', html: strat('Salida estructurada (JSON) + validación', 'Devuelve SOLO JSON con este esquema:\n{"cliente":string,"producto":string,"prioridad":"alta|media|baja"}\nSi falta un dato usa null.', '{"cliente":"Acme","producto":"Panel","prioridad":"alta"}', [5, 4, 5], 'Cuando el resultado alimenta un sistema: se valida con código y se rechaza lo que no cumple el esquema.') },
          { id: 'r', label: 'ReAct (con herramienta)', html: strat('ReAct', 'Puedes usar la herramienta consultar_estado_pedido(id).\nRazona, actúa y observa hasta responder.', 'Razonamiento: necesito el estado real.\nAcción: consultar_estado_pedido("4821")\nObservación: "En tránsito, llega viernes"\nRespuesta: …', [4, 2, 4], 'Cuando se necesita información actual o ejecutar acciones: el modelo solo no la tiene.') },

          { q: 'El asistente debe informar el estado real de un pedido hoy. ¿Qué patrón necesitas?', o: ['ReAct / uso de herramientas', 'Few-shot con ejemplos de estados', 'Subir la temperatura', 'Ampliar la ventana de contexto'], a: 0, e: 'El modelo no conoce datos actuales: necesita consultar una herramienta y observar el resultado.' }] },
      { id: 'l4-sl', type: 'slider', title: 'Calibra la temperatura (si tu modelo la permite)', xp: 50, goal: 'Para cada tarea ajusta el nivel de variabilidad (0 = muy consistente, 1 = muy creativo).', hint: 'Tareas con respuesta «correcta» única → valores bajos. Creación y alternativas → valores altos.',
        items: [{ q: 'Extraer cliente y producto de un correo a JSON', name: 'Extracción', min: 0, max: 1, step: .1, lo: '0 · consistente', hi: '1 · creativo', ok: [0, .3], explain: 'La extracción debe ser reproducible.' }, { q: 'Lluvia de ideas de nombres para una campaña', name: 'Ideación', min: 0, max: 1, step: .1, lo: '0 · consistente', hi: '1 · creativo', ok: [.7, 1], explain: 'Buscas variedad y alternativas.' }, { q: 'Responder dudas sobre la política de vacaciones', name: 'Política', min: 0, max: 1, step: .1, lo: '0 · consistente', hi: '1 · creativo', ok: [0, .3], explain: 'Debe ser fiel al documento, no creativo.' }] },

      { h: 'API keys y autenticación', p: '<p>Una <b>API key</b> identifica y autoriza a tu aplicación; suele ir en un encabezado (<code>Authorization: Bearer …</code> o <code>x-api-key</code>). <b>Nunca</b> la escribas en el código ni en el navegador: guárdala en variables de entorno o un gestor de secretos y llama desde un backend.</p>' },
      { h: 'Tokens (dos significados)', p: '<p>Cuidado con la palabra: los <b>tokens de IA</b> son fragmentos de texto que determinan costo y límites; los <b>tokens de acceso</b> son credenciales (p. ej. OAuth). El campo <code>usage.input_tokens</code> habla de los primeros.</p>' },
      { h: 'Integrar modelos y SDKs', p: '<p>Una llamada típica a un modelo envía <code>model</code>, <code>messages</code> (lista de <code>role</code>/<code>content</code>) y límites como <code>max_tokens</code>. Los <b>SDKs</b> (librerías oficiales) envuelven estas llamadas, manejan reintentos y errores.</p>' },
      { h: 'Códigos de estado', p: '<p><b>2xx</b> éxito · <b>400</b> solicitud inválida · <b>401</b> sin autenticación · <b>403</b> sin permiso · <b>404</b> no encontrado · <b>429</b> demasiadas solicitudes · <b>5xx</b> fallo del servidor (reintentar con espera).</p>' },
    ],
    example: { title: 'Una solicitud a un modelo', html: '<pre>POST https://api.ejemplo-ia.test/v1/messages\nAuthorization: Bearer &lt;TU_CLAVE&gt;\nContent-Type: application/json\n\n{\n  "model": "demo-llm",\n  "max_tokens": 256,\n  "messages": [\n    {"role": "user", "content": "Resume qué es una API."}\n  ]\n}</pre><p>Respuesta:</p><pre>' + A.util.esc(JSON.stringify(RESP, null, 2)) + '</pre><div class="callout">El texto generado está en <code>content[0].text</code>; <code>usage</code> informa los tokens de entrada y salida (costo y límites).</div>' },
    practice: [
      { id: 'l8-mt', type: 'match', title: 'Anatomía de una petición', xp: 40, goal: 'Une cada elemento con su función.', hint: 'Piensa en qué parte indica «adónde», «qué acción», «quién eres» y «qué envías».',
        pairs: [['Endpoint', 'La URL a la que se envía la solicitud'], ['Método HTTP', 'La acción que se quiere realizar (GET, POST…)'], ['Encabezado (header)', 'Metadatos y credenciales de la solicitud'], ['Cuerpo (body)', 'Los datos que se envían, normalmente en JSON'], ['API key', 'Credencial que autentica a tu aplicación'], ['Código de estado', 'Resultado de la solicitud (200, 401, 429…)']] },
      { id: 'l8-st', type: 'match', title: 'Códigos de estado', xp: 40, goal: 'Une cada código con su significado.', hint: '4xx = problema del cliente; 5xx = problema del servidor.',
        pairs: [['200', 'Éxito'], ['400', 'Solicitud mal formada o datos inválidos'], ['401', 'Falta autenticación o la clave es inválida'], ['403', 'Autenticado, pero sin permiso'], ['429', 'Demasiadas solicitudes: espera y reintenta'], ['500', 'Error del servidor']] },
      { id: 'l8-sim', type: 'apisim', title: 'Simulador de API', xp: 100, goal: 'Completa la misión: provoca y diagnostica un 401 y un 400, consigue un 200 e interpreta la respuesta.', hint: 'La clave de práctica es demo-key-123. Añade «Authorization: Bearer demo-key-123» en los encabezados. Para el 400 quita max_tokens.' },
      { id: 'l8-js', type: 'jsonexplorer', title: 'Explorador de JSON', xp: 60, goal: 'Localiza en la respuesta los datos que se piden haciendo clic en su clave.', hint: 'Recuerda que las listas empiezan en [0] y que se baja de nivel en nivel.',
        json: { id: 'msg_demo_01', model: 'demo-llm', content: [{ type: 'text', text: 'Una API es un contrato entre programas.' }], stop_reason: 'end_turn', usage: { input_tokens: 21, output_tokens: 17 } },
        questions: [{ q: '¿Dónde está el texto generado por el modelo?', path: 'content[0].text', e: 'Dentro de la lista content, primer elemento.' }, { q: '¿Cuántos tokens de salida se usaron?', path: 'usage.output_tokens', e: 'Dentro del objeto usage.' }, { q: '¿Por qué terminó la respuesta (motivo de parada)?', path: 'stop_reason', e: 'Está en la raíz.' }, { q: '¿Qué modelo respondió?', path: 'model', e: 'Campo model de la raíz.' }] },
    ],
    challenge: { id: 'l8-ch', type: 'designer', title: 'Reto: diseña una solicitud a un modelo de IA', xp: 150, goal: 'Completa la solicitud conceptual: método, endpoint, encabezados y cuerpo JSON válido. Cuida la seguridad de la clave. ≥ 80%.', hint: 'El cuerpo debe ser JSON válido con model, max_tokens y messages (role+content). La clave: variable de entorno, nunca escrita.',
      scenario: '<b>Caso:</b> tu app de capacitación enviará la pregunta de un colaborador («¿Cuántas horas dura SEG-101?») al modelo <code>demo-llm</code> del endpoint <code>https://api.ejemplo-ia.test/v1/messages</code>.',
      fields: [{ id: 'm', kind: 'select', label: 'Método HTTP', options: ['GET', 'POST', 'PUT', 'DELETE'] }, { id: 'u', kind: 'line', label: 'Endpoint (URL)' }, { id: 'h', kind: 'text', rows: 3, label: 'Encabezados (uno por línea)', help: 'Autenticación y tipo de contenido.' }, { id: 'b', kind: 'text', rows: 9, label: 'Cuerpo (JSON)' }, { id: 's', kind: 'text', rows: 2, label: '¿Dónde guardas la API key y por qué?' }],
      rules: [
        { label: 'Usa POST', check: (v) => v.m === 'POST', hint: 'Enviar un mensaje a un modelo crea/ejecuta algo.' }, { label: 'Endpoint correcto (/v1/messages)', check: (v) => has(v.u, /^https:\/\/api\.ejemplo-ia\.test\/v1\/messages\/?$/i), hint: 'Usa https y la ruta indicada.' }, { label: 'Encabezado Content-Type: application/json', check: (v) => has(v.h, /content-type\s*:\s*application\/json/i) },
        { label: 'Autenticación por encabezado', check: (v) => has(v.h, /(authorization\s*:\s*bearer|x-api-key\s*:)/i), hint: 'Authorization: Bearer … o x-api-key.' }, { label: 'La clave no está escrita en claro (usa variable/placeholder)', check: (v) => !has(v.h, /(demo-key-123|sk-[a-z0-9]{6,})/i) && has(v.h, /(\$\{?[A-Z_]+|<[^>]+>|\{\{.+\}\}|process\.env|env)/i), hint: 'Usa <TU_CLAVE> o ${API_KEY}.' },
        { label: 'El cuerpo es JSON válido', check: (v) => safeJSON(v.b).ok, hint: 'Revisa comillas y comas.' }, { label: 'Incluye model = demo-llm y max_tokens entero', check: (v) => { const j = safeJSON(v.b); return j.ok && j.v.model === 'demo-llm' && Number.isInteger(j.v.max_tokens) && j.v.max_tokens > 0; } }, { label: 'messages con role «user» y content con la pregunta', check: (v) => { const j = safeJSON(v.b); return j.ok && Array.isArray(j.v.messages) && j.v.messages.some((m) => m.role === 'user' && /SEG-101|horas/i.test(m.content || '')); } },
        { label: 'Explica guardar la clave en variable de entorno/gestor de secretos y backend', check: (v) => has(v.s, /(variable de entorno|env|gestor de secretos|secret|backend|servidor)/i) && has(v.s, /(nunca|no |evita|filtr|expu|segur)/i), hint: 'Nunca en el código ni en el navegador.' },
      ], sample: 'POST https://api.ejemplo-ia.test/v1/messages\nAuthorization: Bearer ${API_KEY}\nContent-Type: application/json\n{"model":"demo-llm","max_tokens":200,"messages":[{"role":"user","content":"¿Cuántas horas dura SEG-101?"}]}\nClave: variable de entorno en el backend; nunca en el código ni en el navegador.' },
    mastery: [
      { q: 'Quieres que tu app envíe un mensaje a un modelo. ¿Qué método HTTP es el habitual?', o: ['POST', 'GET', 'DELETE', 'HEAD'], a: 0, e: 'POST envía datos para que el servidor ejecute algo.' },
      { q: 'Recibes HTTP 401. ¿Qué revisas primero?', o: ['La autenticación: que la API key exista y sea válida', 'El idioma del prompt', 'La velocidad de internet', 'El tamaño de la pantalla'], a: 0, e: '401 = no autenticado.' },
      { q: 'Recibes HTTP 429. Lo más adecuado es…', o: ['Esperar y reintentar con espera progresiva', 'Enviar 1000 solicitudes más', 'Cambiar el método a GET', 'Borrar la clave'], a: 0, e: '429 indica límite de tasa.' },
      { q: 'En la respuesta <code>{"content":[{"text":"Hola"}],"usage":{"input_tokens":9}}</code>, ¿cuál es la ruta al texto?', o: ['content[0].text', 'usage.text', 'text.content', 'input_tokens'], a: 0, e: 'Lista content, primer elemento, campo text.' },
      { q: 'Marca TODAS las prácticas seguras con API keys.', o: ['Guardarlas en variables de entorno o gestores de secretos', 'Llamar a la API desde un backend', 'Escribirlas en el código fuente del frontend', 'Rotarlas si se sospecha una filtración'], a: [0, 1, 3], e: 'Una clave en el navegador o en el repositorio se considera comprometida.' },
      { q: 'Un SDK sirve para…', o: ['Usar la API con una librería que maneja detalles como reintentos y errores', 'Reemplazar el modelo', 'Evitar la autenticación', 'Generar claves gratis'], a: 0, e: 'Facilita la integración; sigue usando la API por debajo.' },
      { q: 'En <code>usage.input_tokens</code>, «tokens» se refiere a…', o: ['Fragmentos de texto procesados por el modelo (costo y límites)', 'Credenciales de acceso OAuth', 'Monedas digitales', 'Contraseñas'], a: 0, e: 'No confundir con tokens de acceso.' },
    ],
  };
  if (typeof module !== 'undefined') module.exports = A;

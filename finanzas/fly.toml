app = "finanzas-REEMPLAZA-TU-NOMBRE"   # debe ser único en Fly.io
primary_region = "mia"

[build]
  dockerfile = "Dockerfile"

[env]
  FINANZAS_DB = "/data/finanzas.db"

[mounts]
  source = "finanzas_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"      # el webhook debe responder siempre
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"
